  const items=buckets(g,a).map(x=>{ if(x.a>today()) return Object.assign(x,{plus:null,minus:null}); const st=pmStats(p,x.a,x.b); return st.days?Object.assign(x,{plus:st.plus,minus:st.minus}):Object.assign(x,{plus:null,minus:null}); });
  const ch=mount(v,chartCard('+ y − por '+({day:'día',week:'semana',month:'mes'}[g]),'bar-chart',c=>divergingChart(c,items,{title:'+ y −'}),
    {tools:granSelect(g,x=>{ ui.pmGran=x; saveUI(); renderApp(); },'Agrupar + y − por',['day','week','month']),table:miniTable(['Periodo','+','−','Balance'],items.filter(x=>x.plus!=null).map(x=>[x.full||x.label,fmtNum(x.plus),fmtNum(x.minus),fmtNum(x.plus-x.minus)]))}));
  ch.querySelector('.card-head').after(pmLegend());
  const wd=orderedDows().map(d=>{ const w=s.wd[d]; return {label:DOW_ABBR[d],full:cap(DOW_NAME[d])+' (media)',plus:w.n?Math.round(w.plus/w.n*100)/100:null,minus:w.n?Math.round(w.minus/w.n*100)/100:null}; });
  let worst=null; for(const x of wd) if(x.minus!=null&&x.minus>0&&(!worst||x.minus>worst.minus)) worst=x;
  let bestD=null; for(const x of wd) if(x.plus!=null&&(x.plus-x.minus)>0&&(!bestD||x.plus-x.minus>bestD.plus-bestD.minus)) bestD=x;
  const note=[worst?`Los − se concentran el ${worst.full.split(' ')[0].toLowerCase()} (${fmtNum(worst.minus)} de media)`:'',bestD?`tu mejor día es el ${bestD.full.split(' ')[0].toLowerCase()}`:''].filter(Boolean).join('; ');
  const wc=mount(v,chartCard('+ y − por día de la semana','calendar',c=>divergingChart(c,wd,{title:'Media por día de la semana'}),{note:note?cap(note)+'.':''}));
  wc.querySelector('.card-head').after(pmLegend());
}

function dailyRows(){
  const t=today(), live=liveDailies(), rows=[];
  if(live){
    for(const d of live){ const h=linkedHabit(d.id||d._id,'daily'); const due=!!d.isDue, done=!!d.completed;
      const cl=Array.isArray(d.checklist)?d.checklist:[];
      rows.push({name:d.text||'(sin nombre)',raw:true,due,done,streak:Number(d.streak)||0,check:cl.length?[cl.filter(x=>x.completed).length,cl.length]:null,value:Number(d.value)||0,h}); }
  } else {
    for(const m of habLinks()){ if(m.kind!=='daily') continue; const h=habitById(m.habitId); if(!h||h.archived) continue; const s=dayStatus(h,t);
      rows.push({name:h.name,due:!!s.scheduled,done:!!s.done,streak:m.streak||0,check:null,value:m.value||0,h}); }
  }
  rows.sort((a,b)=>(b.due-a.due)||(a.done-b.done)||mdPlain(a.name).localeCompare(mdPlain(b.name),'es'));
  return rows;
}

  const [e,p]=String(key).split('-');
  if(DROP_POTIONS.includes(p)) return DROP_EGGS.includes(e)?'normal':QUEST_EGGS.includes(e)?'quest':'special';
  if(WACKY_POTIONS.includes(p)) return 'wacky';

  return 'special';
}

/* ================= Personaje: atributos, habilidades y equipo ================= */
const ST_KEYS=['int','per','con','str'];
const ST_INFO={int:['Inteligencia','INT','st-int'],per:['Percepción','PER','st-per'],con:['Constitución','CON','st-con'],str:['Fuerza','FUE','st-str']};
const GEAR_SLOTS=[['weapon','Arma'],['shield','Mano secundaria'],['armor','Armadura'],['head','Cabeza'],['eyewear','Gafas'],['headAccessory','Accesorio de cabeza'],['body','Cuerpo'],['back','Espalda']];
const isEmptyGear=k=>!k||/_base_0$/.test(k);
function gearOf(k){
  const g=habNames&&habNames.gear&&habNames.gear[k]; if(!g) return null;
  return {key:k,name:mdPlain(g[0]),type:g[1],s:{str:g[2],int:g[3],con:g[4],per:g[5]},klass:g[6],sc:g[7],two:!!g[8],value:g[9]};
}
const classGear=(it,cls)=>!!it&&(it.klass===cls||it.sc===cls);
/* Lo que da una pieza: el equipo de tu clase cuenta doble (como en Habitica) */
function gearEff(it,cls){ const m=classGear(it,cls)?2:1, o={}; for(const s of ST_KEYS) o[s]=(Number(it.s[s])||0)*m; return o; }
const DR=(b,max,half)=>max*(b/(b+(half||max/2)));
const fmt1=n=>fmtNum(Math.round(n*10)/10);
/* Atributos como los calcula Habitica: nivel/2 + puntos + equipo + bonus de clase + buffs */
function charStats(snap){
  const st=snap.stats||{}, cls=st.class||'warrior', lvl=Number(st.lvl)||1, lb=Math.floor(Math.min(lvl,100)/2), buffs=st.buffs||{};
  const eq=(snap.gear&&snap.gear.equipped)||{}, gear={str:0,int:0,con:0,per:0}, bonus={str:0,int:0,con:0,per:0};
  let known=!!(habNames&&habNames.gear), missing=0;
  for(const [slot] of GEAR_SLOTS){ const k=eq[slot]; if(isEmptyGear(k)) continue; const it=gearOf(k); if(!it){ missing++; continue; }
    for(const s of ST_KEYS){ gear[s]+=it.s[s]; if(classGear(it,cls)) bonus[s]+=it.s[s]; } }
  const out={cls,lvl,lb,known:known&&!missing,points:Number(st.points)||0,buffs,s:{},t:{}};
  for(const s of ST_KEYS){ const b=Number(buffs[s])||0, p=Number(st[s])||0; out.s[s]={lvl:lb,pts:p,gear:gear[s],cls:bonus[s],buff:b,total:lb+p+gear[s]+bonus[s]+b}; out.t[s]=out.s[s].total; }
  return out;
}
function statEffect(s,v){
  if(s==='int') return `+${fmtNum(Math.round(v*2.5))} % de experiencia · ${fmtNum(2*v+30)} de maná máximo`;
  if(s==='per') return `+${fmtNum(v*2)} % de oro por tarea y más botín`;
  if(s==='con') return `Pierdes un ${fmt1(Math.min(90,v/2.5))} % menos de vida al fallar`;
  return `${fmt1(3*(1+v/100))} % de golpe crítico · +${fmt1(v/2)} % de daño al jefe`;
}
/* ---- Equipo: la mejor combinación entre lo que tienes ---- */
const GEAR_GOALS=[
  ['int','Más experiencia y maná','Inteligencia',{int:1,per:.01,con:.001,str:.001}],
  ['per','Más oro y botín','Percepción',{per:1,int:.01,con:.001,str:.001}],
  ['mix','Equilibrio','Inteligencia y percepción',{int:1,per:1,con:.01,str:.01}],
  ['con','Aguantar los fallos','Constitución',{con:1,int:.01,per:.005,str:.001}],
  ['str','Golpear al jefe','Fuerza',{str:1,int:.01,per:.005,con:.001}]];
const gearGoal=()=>GEAR_GOALS.find(g=>g[0]===ui.gearGoal)||GEAR_GOALS[0];
function ownedGear(snap){ const o=(snap.gear&&snap.gear.owned)||[]; const r=[]; for(const k of o){ if(isEmptyGear(k)) continue; const it=gearOf(k); if(it&&GEAR_TYPES.includes(it.type)) r.push(it); } return r; }
function bestGear(items,cls,w,eq){
  const sc=it=>{ const e=gearEff(it,cls); return ST_KEYS.reduce((a,s)=>a+e[s]*(w[s]||0),0); };
  /* La mejor de cada hueco; a igualdad, la que ya llevas */
  const pick=list=>{ let best=null,bs=0; const l=list.slice().sort((a,b)=>(eq[b.type]===b.key)-(eq[a.type]===a.key)); for(const it of l){ const v=sc(it); if(v>bs+1e-9){ best=it; bs=v; } } return {it:best,s:bs}; };
  const by=t=>items.filter(i=>i.type===t), set={};
  for(const [slot] of GEAR_SLOTS) if(slot!=='weapon'&&slot!=='shield') set[slot]=pick(by(slot)).it;
  /* Arma a dos manos frente a arma de una mano más la mano secundaria */
  const w2=pick(by('weapon').filter(i=>i.two)), w1=pick(by('weapon').filter(i=>!i.two)), sh=pick(by('shield'));
  const curTwo=(gearOf(eq.weapon)||{}).two;
  if(w2.it&&(w2.s>w1.s+sh.s+1e-9||(Math.abs(w2.s-(w1.s+sh.s))<1e-9&&curTwo))){ set.weapon=w2.it; set.shield=null; } else { set.weapon=w1.it; set.shield=sh.it; }
  /* Huecos sin nada que sume: se queda lo que llevas */
  for(const [slot] of GEAR_SLOTS){ if(set[slot]) continue; const k=eq[slot]; if(isEmptyGear(k)) continue; const it=gearOf(k); if(!it) continue;
    if(slot==='shield'&&set.weapon&&set.weapon.two) continue; if(slot==='weapon'&&it.two&&set.shield) continue; set[slot]=it; }
  let score=0; for(const [slot] of GEAR_SLOTS) if(set[slot]) score+=sc(set[slot]);
  return {set,score};
}
function gearTotals(base,set,cls){ const t=Object.assign({},base); for(const [slot] of GEAR_SLOTS){ const it=set[slot]; if(!it) continue; const e=gearEff(it,cls); for(const s of ST_KEYS) t[s]+=e[s]; } return t; }
/* La siguiente pieza de tu clase en la tienda, por hueco */
function nextClassGear(snap,cls){
  const owned=new Set((snap.gear&&snap.gear.owned)||[]), g=habNames&&habNames.gear||{}, out=[];
  for(const slot of ['weapon','armor','head','shield']){
    const re=new RegExp(`^${slot}_${cls}_(\\d+)$`); let best=null,bn=1e9;
    for(const k of Object.keys(g)){ const m=re.exec(k); if(!m) continue; const n=Number(m[1]); if(n<1||owned.has(k)||!(g[k][9]>0)) continue; if(n<bn){ bn=n; best=k; } }
    if(best) out.push(gearOf(best));
  }
  return out;
}

function manaPlan(cls,mp,t,b,snap){
  const boss=snap.quest&&snap.quest.active&&Number.isFinite(Number(snap.quest.progress&&snap.quest.progress.hp));
  if(cls!=='wizard'||mp<10) return '';
  const dmg=Math.ceil(t.int*0.1);
  if(snap.party&&mp>=35){ const f=Math.floor((mp-35)/10), q=Math.ceil(DR(t.int-(Number(b.int)||0),30,200)), left=mp-35-f*10;
    return `Terremoto (35)${f?` y ${pl(f,'Estallido de llamas','Estallidos de llamas')} (${f*10})`:''}. El grupo gana +${q} de inteligencia${f&&boss?` y el jefe pierde ${fmtNum(f*dmg)} de vida`:''}${left?`; te ${left===1?'sobra':'sobran'} ${left} de maná`:''}.`; }
  const f=Math.floor(mp/10); return `${pl(f,'Estallido de llamas','Estallidos de llamas')}${boss?`: ${fmtNum(f*dmg)} de daño al jefe`:''}.`;
}
function buffGain(s,n,t){
  if(s==='int') return `Ganas un ${fmt1(n*2.5)} % más de experiencia y ${fmtNum(2*n)} de maná máximo.`;
  if(s==='per') return `Ganas un ${fmtNum(n*2)} % más de oro.`;
  if(s==='con') return `Pierdes un ${fmt1(n/2.5)} % menos de vida al fallar.`;
  return `Más golpes críticos y +${fmt1(n/2)} % de daño al jefe.`;
}

/* Golpes del chat del grupo: Habitica escribe uno por persona al cerrar su día */
function battleEvents(chat,key){
  const out=[]; let start=0;
  for(const m of chat||[]){ const i=m&&m.info; if(!i||!i.type) continue; const t=msOf(m.timestamp); if(!Number.isFinite(t)) continue;
    if(key&&i.quest&&i.quest!==key) continue;
    if(i.type==='quest_start'){ if(t>start) start=t; out.push({t,k:'start'}); continue; }
    const u=mdPlain(String(i.user||''));
    if(i.type==='boss_damage'||i.type==='boss_dont_attack') out.push({t,k:'hit',u,ud:Number(i.userDamage)||0,bd:i.type==='boss_damage'?Number(i.bossDamage)||0:0});
    else if(i.type==='user_found_items'){ let n=0; if(i.items&&typeof i.items==='object') for(const v of Object.values(i.items)) n+=Number(v)||0; out.push({t,k:'found',u,n}); }
    else if(i.type==='boss_rage') out.push({t,k:'rage'});
    else if(i.type==='boss_defeated'||i.type==='all_items_found') out.push({t,k:'win'});
  }
  return out.filter(e=>e.t>=start).sort((a,b)=>a.t-b.t).slice(-200);
}

/* Vida del jefe por día (reconstruida con los golpes del chat) y la previsión hasta 0 */
function bossChart(B,hp,max,avg){
  const pts=[[today(),hp]]; let cur=hp;
  for(const [d,dm] of B.dmgDay){ cur=Math.min(max,cur+dm); pts.push([addDaysS(d,-1),cur]); }
  pts.reverse(); const days=Math.ceil(hp/avg), first=pts[0][0], span=Math.max(1,daysBetween(first,today())+days);
  const W=320,H=150,L=34,R=310,T=10,Bt=120, X=d=>L+(R-L)*daysBetween(first,d)/span, Y=v=>Bt-(Bt-T)*v/max;
  const s=document.createElementNS(SVGNS,'svg'); s.setAttribute('viewBox',`0 0 ${W} ${H}`); s.setAttribute('width','100%'); s.setAttribute('role','img');
  s.setAttribute('aria-label',`Vida del jefe por día: de ${fmtNum(Math.round(pts[0][1]))} el ${fmtDate(first)} a ${fmtNum(Math.round(hp))} hoy; a este ritmo llega a 0 hacia el ${fmtDate(addDaysS(today(),days))}`);
  const mk=(tag,at)=>{ const e=document.createElementNS(SVGNS,tag); for(const [k,val] of Object.entries(at)) e.setAttribute(k,val); s.append(e); return e; };
  for(const v of [max,max/2,0]){ mk('line',{x1:L,y1:Y(v),x2:R,y2:Y(v),stroke:'var(--line)'}); const t=mk('text',{x:L-4,y:Y(v)+4,'font-size':10,'text-anchor':'end',fill:'var(--muted)'}); t.textContent=fmtNum(Math.round(v)); }
  const poly=pts.map(p=>`${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ');
  mk('path',{d:`M${poly.split(' ').join(' L')} L${X(today()).toFixed(1)},${Bt} L${L},${Bt} Z`,fill:'var(--hab-hp)',opacity:.14});
  mk('polyline',{points:poly,fill:'none',stroke:'var(--hab-hp)','stroke-width':2.5,'stroke-linejoin':'round'});
  mk('line',{x1:X(today()),y1:Y(hp),x2:X(addDaysS(today(),days)),y2:Bt,stroke:'var(--hab-hp)','stroke-width':2,'stroke-dasharray':'5 5'});
  mk('circle',{cx:X(today()),cy:Y(hp),r:5,fill:'var(--hab-hp)',stroke:'var(--panel)','stroke-width':2});
  const lab=(d,txt,anchor,bold)=>{ const t=mk('text',{x:X(d),y:140,'font-size':10,'text-anchor':anchor,fill:bold?'var(--ink)':'var(--muted)','font-weight':bold?700:400}); t.textContent=txt; };
  lab(first,fmtDate(first),'start'); lab(today(),'hoy','middle',true); lab(addDaysS(today(),days),fmtDate(addDaysS(today(),days)),'end');
  return s;
}

/* ================= Fase 2: calendario y estadísticas ================= */
const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MON3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const ymKey=(y,m)=>`${y}-${pad(m+1)}`;
const monthEnd=(y,m)=>ymd(new Date(y,m+1,0));
const habitsForStats=()=>habitsSorted().filter(h=>ui.inclArchived||!h.archived);
/* Estado de un día para el conjunto de hábitos: all, some, none, pending, pause, off (no tocaba) o future */
function dayGlobal(d,habits){
  const ix=I(), key=d+'|'+habits.map(h=>h.id).join(',');
  if(!ix.dayG) ix.dayG=new Map();
  const c=ix.dayG.get(key); if(c) return c;
  let due=0,done=0,paused=0;
  if(d<=ix.today) for(const h of habits){
    if(!inRange(h,d)) continue;
    const dn=isDoneDay(h,d), sc=scheduleEntryAt(h,d).schedule;
    if(h.kind==='avoid'){ if(!isScheduled(h,d)) continue; if(isSkipped(h.id,d)){ paused++; continue; } due++; if(dn) done++; continue; }
    if(isQuota(sc)||!isScheduled(h,d)){ if(dn){ due++; done++; } continue; }   // sin obligación ese día: solo suma si se hizo
    if(!dn&&isSkipped(h.id,d)){ paused++; continue; }
    due++; if(dn) done++;
  }
  let st;
  if(d>ix.today) st='future';
  else if(!due) st=paused?'pause':'off';
  else if(done===due) st='all';
  else if(!done) st=d===ix.today?'pending':'none';
  else st='some';
  const r={due,done,paused,st,frac:due?done/due:null};
  ix.dayG.set(key,r); return r;
}
/* Estado de un día para un hábito */
function habitDay(h,d){
  const t=today();
  if(d>t) return {st:'future'};
  if(!inRange(h,d)) return {st:'out'};
  const log=getLog(h.id,d), skip=getSkip(h.id,d), sc=scheduleEntryAt(h,d).schedule;
  const frac=log?(h.kind==='count'?log.value/h.target.amount:1):0;
  if(h.kind==='avoid'){ if(skip&&!log) return {st:'pause',skip}; if(log) return {st:'missed',log}; if(!isScheduled(h,d)) return {st:'off'}; return {st:d===t?'pending':'done'}; }
  if(isQuota(sc)){
    /* Cuotas: el día anotado en color intenso (más intenso cuantos más elementos), el resto del periodo cumplido en claro */
    const e=scheduleEntryAt(h,d), [a,b]=periodOf(e,d), w=evalPeriod(h,e,a,b,t);
    if(log&&(isDoneDay(h,d)||isCycle(sc))){ const n=h.kind==='count'?log.value:1; return {st:'done',log,frac:1,period:w,lvl:isCycle(sc)?Math.max(1,Math.min(4,Math.ceil(n))):4}; }
    if(skip) return {st:'pause',skip,period:w};
    if(log) return {st:'partial',log,frac,period:w};
    if(w.status==='done') return {st:'pdone',period:w};
    if(w.status==='missed'&&d===w.end) return {st:'missed',period:w};
    return {st:'free',period:w};
  }
  if(isDoneDay(h,d)) return {st:'done',log,frac:1};
  if(skip) return {st:'pause',skip};
  if(log) return {st:'partial',log,frac};
  if(!isScheduled(h,d)) return {st:'off'};
  return {st:d===t?'pending':'missed'};
}
const DAY_TXT={pdone:'Periodo cumplido',all:'Todos cumplidos',some:'Algunos cumplidos',none:'Ninguno cumplido',pending:'Pendiente',pause:'Pausa',off:'No tocaba',future:'',done:'Hecho',partial:'Parcial',missed:'No cumplido',free:'Sin registro',out:'Fuera de las fechas del hábito'};
function dayTip(d,info,h){
  let s=cap(fmtDate(d,true))+'\n';
  if(h){
    s+=(h.kind==='avoid'&&info.st==='done'?'Día limpio':h.kind==='avoid'&&info.st==='missed'?'Recaída':DAY_TXT[info.st])||'';
    const w=info.period, per={week:'semana',month:'mes',year:'año',block:'periodo'};
    if(w&&info.st==='pdone') s=cap(fmtDate(d,true))+'\n'+({week:'Semana cumplida',month:'Mes cumplido',year:'Año cumplido'}[w.per]||'Periodo cumplido');
    if(w&&isCycle(scheduleEntryAt(h,d).schedule)){ if(info.log) s+=` · ${pl(info.log.value,'elemento','elementos')} de la lista`; }
    else if(h.kind==='count'&&info.log) s+=` · ${fmtNum(info.log.value)}${h.target.unit?' '+h.target.unit:''} de ${fmtNum(h.target.amount)}`;
    if(w&&w.status!=='skip') s+=`\n${w.per==='week'?'Semana':w.per==='month'?'Mes':w.per==='year'?'Año':'Periodo'} del ${fmtDate(w.start)} al ${fmtDate(w.end)}: ${fmtNum(w.count)} de ${w.required||w.times}${w.marked?' (dada por hecha en Habitica)':''}`;
    if(info.st==='pause'&&info.skip.reason) s+=` · ${info.skip.reason}`;
    if(info.log&&info.log.note) s+='\n'+info.log.note;
  } else {
    s+=DAY_TXT[info.st]||'';
    if(info.due) s+=` · ${info.done} de ${info.due}`;
    if(info.paused) s+=` · ${pl(info.paused,'en pausa','en pausa')}`;
  }
  return s;
}
/* Cumplimiento de un mes: por hábito, o la media de los hábitos que tocaban */
function monthCompliance(habits,y,m){
  const a=ymKey(y,m)+'-01', b=monthEnd(y,m);
  if(a>today()) return null;
  const vals=[]; let sum=0,n=0;
  for(const h of habits){ const c=compliance(h,a,b); if(c.value!=null){ vals.push(c.value); sum+=c.sum; n+=c.n; } }
  return vals.length?{value:vals.reduce((x,v)=>x+v,0)/vals.length,sum,n,habits:vals.length}:null;
}
function globalCompliance(habits,a,b){
  const vals=habits.map(h=>compliance(h,a,b).value).filter(v=>v!=null);
  return vals.length?vals.reduce((x,v)=>x+v,0)/vals.length:null;
}

/* ---- Cuadrícula anual (tipo «contribuciones») ---- */
const hmScroll={};
function heatmap(h,habits,period,key,opts={}){
  const t=today();
  let start,end,lo,hi;
  if(period==='12m'){ end=addDaysS(weekStartOf(t),6); start=addDaysS(weekStartOf(t),-52*7); lo=addDaysS(t,-364); hi=t; }
  else { lo=period+'-01-01'; hi=period+'-12-31'; start=weekStartOf(lo); end=addDaysS(weekStartOf(hi),6); }
  const wrap=el('div','hm'+(opts.numbers?' big':'')+(opts.edit?' edit':''));
  const days=el('div','hm-days'); days.append(el('span',''));
  orderedDows().forEach((dw,i)=>days.append(el('span','',i%2===0?DOW_LETTER[dw]:'')));
  const sc=el('div','hm-scroll'); sc.dataset.key=key;
  const months=el('div','hm-months'), grid=el('div','hm-grid');
  grid.setAttribute('role','img');
  let col=0, done=0, due=0;
  for(let d=start; d<=end; d=addDaysS(d,1)){
    const i=daysBetween(start,d), c=document.createElement('b');
    if(opts.numbers) c.textContent=String(Number(d.slice(8)));
    if(i%7===0){
      col=i/7;
      /* El nombre del mes va en la columna que contiene su día 1 */
      const dd=parseYMD(d);
      for(let k=0;k<7;k++){ const x=addDays(dd,k); if(x.getDate()===1&&ymd(x)>=lo&&ymd(x)<=hi){ const s=el('span','',MON3[x.getMonth()]); s.style.left=`calc(${col} * (var(--hm) + 2px))`; months.append(s); } }
    }
    if(d<lo||d>hi){ c.className='x'; grid.append(c); continue; }
    if(d>t){ c.className='fut'; grid.append(c); continue; }
    let info;
    if(opts.mood){ const m=getMood(d); c.className=m?'mo'+m.value:''; if(d===t) c.classList.add('today'); c.setAttribute('data-tip',cap(fmtDate(d,true))+'\n'+(m?MOODS[m.value-1][1]+(m.note?'\n'+m.note:''):'Sin anotar')); c.addEventListener('click',()=>openDay(d,null)); grid.append(c); continue; }
    if(h){
      info=habitDay(h,d);
      c.style.setProperty('--c',`var(--hc-${h.color})`);
      c.className=info.st==='done'?(info.lvl&&info.lvl<4?'hd q'+info.lvl:'hd'):info.st==='pdone'?'pq':info.st==='partial'?'hp':info.st==='missed'?'l0':info.st==='pause'?'pa':'';
      if(info.st==='done'){ done++; due++; } else if(info.st==='missed') due++;
    } else {
      info=dayGlobal(d,habits);
      if(info.due){ const f=info.frac; c.className=f>=1?'l4':f>=2/3?'l3':f>=1/3?'l2':f>0?'l1':(info.st==='pending'?'':'l0'); done+=info.done; due+=info.due; }
      else if(info.st==='pause') c.className='pa';
    }
    if(d===t) c.classList.add('today');
    c.setAttribute('data-tip',dayTip(d,info,h));
    c.addEventListener('click',()=>openDay(d,h));
    grid.append(c);
  }
  grid.setAttribute('aria-label',`Cuadrícula de ${period==='12m'?'los últimos 12 meses':'el año '+period}: ${done} de ${due} días cumplidos`);
  months.style.width=`calc(${col+1} * (var(--hm) + 2px))`;
  sc.append(months,grid); wrap.append(days,sc);
  sc.addEventListener('scroll',()=>{ hmScroll[key+'|'+period]=sc.scrollLeft; },{passive:true});
  /* Al repintar se conserva el desplazamiento; la primera vez, se muestra el final (lo más reciente) */
  requestAnimationFrame(()=>{ const k=key+'|'+period; sc.scrollLeft=k in hmScroll?hmScroll[k]:(period==='12m'||period===t.slice(0,4)?sc.scrollWidth:0); });
  const out=el('div'); out.append(wrap);
  const lg=el('div','legend');
  if(opts.mood){ for(const [val,l] of MOODS){ const s2=el('span'), i=el('i'); i.style.background=`var(--m${val})`; s2.append(i,document.createTextNode(l)); lg.append(s2); } }
  else if(h){ const sw=(st,txt)=>{ const s=el('span'), i=el('i'); i.setAttribute('style',st); s.append(i,document.createTextNode(txt)); return s; }; const c=`var(--hc-${h.color})`;
    if(h.scheduleHistory.some(e=>isQuota(e.schedule))){ const cyc=h.scheduleHistory.some(e=>isCycle(e.schedule));
      lg.append(sw(`background:color-mix(in srgb,${c} 28%,var(--heat-off))`,'Periodo cumplido'));
      if(cyc){ const s=el('span'); s.append(document.createTextNode('Días anotados: 1')); for(const k of [1,2,3,4]){ const i=el('i'); i.setAttribute('style',`background:${k<4?`color-mix(in srgb,${c} ${[0,55,72,86][k]}%,var(--heat-off))`:c}`); s.append(i); } s.append(document.createTextNode('4 o más')); lg.append(s); }
      else lg.append(sw(`background:${c};border-color:${c}`,'Día anotado'));
      lg.append(sw('background:var(--heat-0)','Periodo no cumplido'),sw('background:var(--pause-soft)','Pausa')); }
    else lg.append(sw(`background:${c};border-color:${c}`,'Hecho'),sw(`background:color-mix(in srgb,${c} 40%,var(--heat-off))`,'Parcial'),sw('background:var(--heat-0)','No cumplido'),sw('background:var(--pause-soft)','Pausa'),sw('background:var(--heat-off)','No tocaba')); }
  else { const s=el('span'); s.append(document.createTextNode('Menos')); for(const k of [0,1,2,3,4]){ const i=el('i'); i.style.background=`var(--heat-${k})`; s.append(i); } s.append(document.createTextNode('Más')); lg.append(s); const p=el('span'), i=el('i'); i.style.background='var(--heat-off)'; p.append(i,document.createTextNode('No tocaba')); lg.append(p); }
  out.append(lg);
  return out;
}

function svgEl(tag,attrs){ const e=document.createElementNS(SVGNS,tag); for(const [k,v] of Object.entries(attrs)) e.setAttribute(k,v); return e; }
function monthBars(container,series,color){
  const W=Math.max(260,container.clientWidth||600), H=200, ml=40, mr=8, mt=20, mb=24;
  const pw=W-ml-mr, ph=H-mt-mb, band=pw/series.length, bw=Math.min(24,band*0.62);
  const svg=svgEl('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,role:'img'});
  const valid=series.filter(s=>s.c);
  svg.setAttribute('aria-label','Cumplimiento por mes. '+series.map(s=>`${s.full}: ${s.c?fmtPct(s.c.value):'sin datos'}`).join('; '));
  for(const g of [0,.5,1]){
    const yy=mt+ph*(1-g);
    svg.append(svgEl('line',{x1:ml,x2:W-mr,y1:yy,y2:yy,class:'gl'}));
    const tx=svgEl('text',{x:ml-6,y:yy+4,'text-anchor':'end',class:'ax'}); tx.textContent=NFP.format(g).replace(',0',''); svg.append(tx);
  }
  const best=valid.length?valid.reduce((a,b)=>b.c.value>a.c.value?b:a):null;
  const lastValid=valid[valid.length-1];
  series.forEach((s,i)=>{
    const cx=ml+band*i+band/2;
    const lab=svgEl('text',{x:cx,y:H-6,'text-anchor':'middle',class:'ax'});
    lab.textContent=(band<26&&i%2===1)?'':(s.m===0&&series.length>1&&i>0?s.label+' '+String(s.y).slice(2):s.label); svg.append(lab);
    if(!s.c) return;
    const v=s.c.value, hgt=Math.max(0,ph*v), x=cx-bw/2, y0=mt+ph, y=y0-hgt, r=Math.min(4,hgt,bw/2);
    const tip=`${cap(s.full)}: ${fmtPct(v)}\n${pl(s.c.habits,'hábito','hábitos')}`;
    const hit=svgEl('rect',{x:ml+band*i,y:mt,width:band,height:ph,class:'hit','data-tip':tip}); svg.append(hit);
    if(hgt>0){
      const p=svgEl('path',{d:`M${x},${y0} V${y+r} Q${x},${y} ${x+r},${y} H${x+bw-r} Q${x+bw},${y} ${x+bw},${y+r} V${y0} Z`,fill:color,class:'bar','data-tip':tip});
      svg.append(p);
    } else svg.append(svgEl('line',{x1:x,x2:x+bw,y1:y0-0.5,y2:y0-0.5,stroke:color,'stroke-width':1,'data-tip':tip}));
    if(s===best||s===lastValid){ const vl=svgEl('text',{x:cx,y:y-6,'text-anchor':'middle',class:'vl'}); vl.textContent=NFP.format(v).replace(/,\d/,''); svg.append(vl); }
  });
  container.replaceChildren(svg);
}

const NFP0=new Intl.NumberFormat('es-ES',{style:'percent',maximumFractionDigits:0});
const fmtPct0=x=>x==null?'—':NFP0.format(x);
const fmtDelta=x=>x==null?'—':(Math.abs(x)<0.005?'±0 %':(x>0?'+':'−')+NFP0.format(Math.abs(x)));

}
/* Límites del periodo elegido: últimos 12 meses o un año natural */
function periodBounds(p=ui.statPeriod){
  const t=today();
  if(p==='12m') return [addDaysS(t,-364),t];
  return [p+'-01-01',(p+'-12-31')>t?t:p+'-12-31'];
}
const periodName=(p=ui.statPeriod)=>p==='12m'?'últimos 12 meses':'año '+p;
function periodOptions(){
  const t=today(), cy=Number(t.slice(0,4));
  const minY=state.habits.length?Math.min(cy,...state.habits.map(x=>Number(x.startDate.slice(0,4)))):cy;
  const ys=[]; for(let y=cy;y>=minY;y--) ys.push(String(y));

  return ys;

/* Frecuencia esperada (veces por día) de una programación */
function freqOf(s){ switch(s.type){ case 'weekdays': return s.days.length/7/(s.every||1); case 'everyN': return 1/s.n; case 'monthDays': return s.days.length/30.44/(s.every||1); case 'nthWeekday': return s.weeks.length*s.days.length/30.44/s.every; case 'yearly': return 1/365.25/s.every; case 'timesPerWeek': return s.times/7; case 'timesPerMonth': return s.times/30.44; case 'timesPerYear': return s.times/365.25; case 'timesPerDays': return s.times/s.days; case 'cycle': return s.times*freqOf(s.base); default: return 1; } }

/* ---- Puntuación (fuerza del hábito), como en Loop: media móvil exponencial de lo cumplido ----
   Vida media de 13/√f días (f = veces esperadas por día). Cada día o semana programada aporta 1 si se cumple,
   0 si no, o la parte cumplida (cantidad / objetivo, registros / cuota). Pausas y días sin obligación no cuentan. */
function scoreSeries(h){
  h=asHabit(h); const ix=I(); if(!ix.score) ix.score=new Map();
  const c=ix.score.get(h.id); if(c) return c;
  const pts=[]; let s=0;
  for(const u of unitsOf(h)){
    if(u.status==='pending'||u.status==='skip') continue;
    const sc=scheduleEntryAt(h,u.start).schedule, f=freqOf(sc), half=13/Math.sqrt(f);
    const m=Math.pow(.5,(u.kind==='period'?u.len:1/f)/half);
    let v;
    if(u.kind==='period') v=u.status==='done'?1:Math.min(u.count,u.required)/u.required;
    else if(u.status==='done') v=1;
    else if(h.kind==='count'){ const l=getLog(h.id,u.start); v=l?Math.min(1,l.value/h.target.amount):0; }
    else v=0;
    s=s*m+v*(1-m);
    pts.push({d:u.end<ix.today?u.end:ix.today,s});
  }
  ix.score.set(h.id,pts); return pts;
}

/* ---- Tramos de tiempo para los gráficos ---- */
const Q_START=[0,3,6,9];
function buckets(gran,lo){
  const t=today(), out=[], ty=Number(t.slice(0,4)), tm=Number(t.slice(5,7))-1;
  if(gran==='day'){ for(let i=29;i>=0;i--){ const d=addDaysS(t,-i), dd=parseYMD(d); out.push({a:d,b:d,label:dd.getDate()===1||i===29?`${dd.getDate()} ${MON3[dd.getMonth()]}`:String(dd.getDate()),full:cap(fmtDate(d,true))}); } }
  else if(gran==='week'){ const w0=weekStartOf(t); for(let i=25;i>=0;i--){ const a=addDaysS(w0,-7*i), dd=parseYMD(a); out.push({a,b:addDaysS(a,6),label:`${dd.getDate()} ${MON3[dd.getMonth()]}`,full:`Semana del ${fmtDate(a)}`}); } }
  else if(gran==='month'){ for(let i=11;i>=0;i--){ const d=new Date(ty,tm-i,1), y=d.getFullYear(), m=d.getMonth(); out.push({a:ymKey(y,m)+'-01',b:monthEnd(y,m),label:m===0?`${MON3[m]} ${String(y).slice(2)}`:MON3[m],full:`${MONTHS[m]} de ${y}`}); } }
  else if(gran==='quarter'){ const q0=Math.floor(tm/3); for(let i=7;i>=0;i--){ const d=new Date(ty,(q0-i)*3,1), y=d.getFullYear(), q=Math.floor(d.getMonth()/3); out.push({a:ymKey(y,q*3)+'-01',b:monthEnd(y,q*3+2),label:`T${q+1} ${String(y).slice(2)}`,full:`${q+1}.º trimestre de ${y}`}); } }
  else { const y0=Math.max(Number((lo||t).slice(0,4)),ty-9); for(let y=y0;y<=ty;y++) out.push({a:y+'-01-01',b:y+'-12-31',label:String(y),full:'Año '+y}); }

/* ---- Cálculos de análisis ---- */
/* Cumplimiento por día de la semana (solo días con obligación) */
function weekdayRates(h,a,b){
  const sum=Array(7).fill(0), n=Array(7).fill(0);
  for(const u of unitsOf(h)){ if(u.kind!=='day'||u.start<a||u.start>b) continue; if(u.status==='done'||u.status==='missed'){ const w=dowOf(u.start); n[w]++; if(u.status==='done') sum[w]++; } }
  return sum.map((s,i)=>n[i]?s/n[i]:null).map((v,i)=>({v,n:n[i]}));
}
function weekdayGlobal(habits,a,b){
  const acc=Array.from({length:7},()=>[]);
  for(const h of habits){ weekdayRates(h,a,b).forEach((r,i)=>{ if(r.v!=null) acc[i].push(r.v); }); }
  return acc.map(x=>x.length?x.reduce((p,c)=>p+c,0)/x.length:null);
}
/* Registros contados en un tramo: días hechos, cantidad sumada o recaídas */
function countIn(h,a,b){
  const m=I().logs.get(h.id); let n=0, sum=0;
  if(m) for(const [d,l] of m){ if(d<a||d>b) continue; if(h.kind==='avoid'){ n++; continue; } if(h.kind==='count'){ sum+=l.value; if(l.value>=h.target.amount) n++; } else n++; }
  return {n,sum};
}
/* «Hábitos que van juntos»: cuando cumples A, ¿cumples más B? */
function relations(habits,a,b){
  const end=b<today()?b:addDaysS(today(),-1), maps=new Map();
  for(const h of habits){ const m=new Map(); for(const u of unitsOf(h)){ if(u.kind!=='day'||u.start<a||u.start>end) continue; if(u.status==='done') m.set(u.start,1); else if(u.status==='missed') m.set(u.start,0); } maps.set(h.id,m); }
  const out=[];
  for(const A of habits) for(const B of habits){
    if(A.id===B.id) continue;
    const ma=maps.get(A.id), mb=maps.get(B.id); let n1=0,c1=0,n0=0,c0=0;
    for(const [d,va] of ma){ const vb=mb.get(d); if(vb==null) continue; if(va){ n1++; c1+=vb; } else { n0++; c0+=vb; } }
    if(n1<10||n0<5) continue;
    out.push({a:A,b:B,p1:c1/n1,p0:c0/n0,diff:c1/n1-c0/n0,n:n1+n0});
  }
  return out.sort((x,y)=>Math.abs(y.diff)-Math.abs(x.diff));
}
/* Mejor y peor día de la semana, mejor mes, tendencia y fines de semana */
function insights(habits,a,b){
  const wd=habits.length===1?weekdayRates(habits[0],a,b).map(x=>x.v):weekdayGlobal(habits,a,b);
  const idx=[0,1,2,3,4,5,6].filter(i=>wd[i]!=null);
  const best=idx.length?idx.reduce((p,c)=>wd[c]>wd[p]?c:p):null, worst=idx.length?idx.reduce((p,c)=>wd[c]<wd[p]?c:p):null;
  const t=today(), last30=globalCompliance(habits,addDaysS(t,-29),t), prev30=globalCompliance(habits,addDaysS(t,-59),addDaysS(t,-30));
  const ms=buckets('month').filter(x=>x.b>=a&&x.a<=b).map(x=>({x,c:globalCompliance(habits,x.a>a?x.a:a,x.b<b?x.b:b)})).filter(x=>x.c!=null);
  const bestM=ms.length?ms.reduce((p,c)=>c.c>p.c?c:p):null;
  const avg=arr=>{ const v=arr.filter(x=>x!=null); return v.length?v.reduce((p,c)=>p+c,0)/v.length:null; };
  return {wd,best,worst,trend:last30!=null&&prev30!=null?last30-prev30:null,bestM,weekdays:avg([1,2,3,4,5].map(i=>wd[i])),weekend:avg([0,6].map(i=>wd[i]))};
}

/* Mejores rachas: barras centradas con las fechas a los lados (las 10 más largas, en orden cronológico) */
function streakBars(h,st){
  const runs=st.runs.slice().sort((x,y)=>y.length-x.length).slice(0,10).sort((x,y)=>x.start<y.start?1:-1);
  const w=el('div','streaks'); w.style.setProperty('--c',`var(--hc-${h.color})`);
  if(!runs.length){ w.append(el('div','muted','Todavía no hay rachas')); return w; }
  const max=Math.max(...runs.map(r=>r.length)), cur=st.current?st.runs[st.runs.length-1]:null;
  for(const r of runs){
    const row=el('div','srow'); row.style.gridTemplateColumns=`minmax(0,1fr) ${Math.max(12,Math.round(r.length/max*(isMobile()?44:52)))}% minmax(0,1fr)`;
    const bar=el('div','sbar'+(r.length===max?' top':r.length>=max*0.6?' mid':''),String(r.length));
    bar.setAttribute('data-tip',`${streakUnit(r.length,r.kind)} · ${fmtDate(r.start)} – ${fmtDate(r.end)}${r===cur?' (actual)':''}`);
    row.append(el('span','sd l',DTF.shortY.format(parseYMD(r.start))),bar,el('span','sd',r===cur?'Actual':DTF.shortY.format(parseYMD(r.end))));
    w.append(row);
  }
  return w;
}
/* Frecuencia: puntos por día de la semana (filas) y mes (columnas); el tamaño es el número de veces */
function dotMatrix(container,h,color){
  const it=monthSeries([h],ui.statPeriod), rows=orderedDows();
  const cnt=rows.map(()=>it.map(()=>0)), isAvoid=h.kind==='avoid';
  const m=I().logs.get(h.id);
  if(m) for(const [d,l] of m){ if(!isAvoid&&!isDoneDay(h,d)) continue; const y=Number(d.slice(0,4)), mo=Number(d.slice(5,7))-1, ci=it.findIndex(x=>x.y===y&&x.m===mo); if(ci<0) continue; cnt[rows.indexOf(dowOf(d))][ci]++; }
  const mx=Math.max(1,...cnt.flat());
  const W=Math.max(260,container.clientWidth||600), mr=40, ml=6, mt=6, rowH=30, H=mt+rowH*7+30, colW=(W-ml-mr)/it.length, rmax=Math.min(colW,rowH)/2-2;
  const svg=svgEl('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,role:'img'});
  svg.setAttribute('aria-label','Frecuencia por día de la semana y mes. '+rows.map((d,ri)=>`${DOW_NAME[d]}: `+it.map((x,ci)=>`${x.label} ${cnt[ri][ci]}`).join(', ')).join('. '));
  rows.forEach((d,ri)=>{
    const cy=mt+rowH*ri+rowH/2;
    svg.append(svgEl('line',{x1:ml,x2:W-mr,y1:mt+rowH*ri,y2:mt+rowH*ri,class:'gl'}));
    const lb=svgEl('text',{x:W-mr+6,y:cy+4,class:'ax'}); lb.textContent=DOW_ABBR[d]; svg.append(lb);
    it.forEach((x,ci)=>{ const n=cnt[ri][ci]; if(!n) return; const cx=ml+colW*ci+colW/2;
      svg.append(svgEl('circle',{cx,cy,r:Math.max(2.5,rmax*Math.sqrt(n/mx)),fill:isAvoid?'var(--danger)':color,'fill-opacity':(0.45+0.55*n/mx).toFixed(2),'data-tip':`${cap(DOW_NAME[d])}, ${x.full}: ${pl(n,isAvoid?'recaída':'vez',isAvoid?'recaídas':'veces')}`})); });
  });
  svg.append(svgEl('line',{x1:ml,x2:W-mr,y1:mt+rowH*7,y2:mt+rowH*7,class:'gl'}));
  const step=Math.max(1,Math.ceil(34/colW));
  it.forEach((x,ci)=>{ if(ci%step) return; const tx=svgEl('text',{x:ml+colW*ci+colW/2,y:mt+rowH*7+16,'text-anchor':'middle',class:'ax'}); tx.textContent=x.label; svg.append(tx); });
  container.replaceChildren(svg);
}


/* ---- Ánimo y hábitos (como las correlaciones de Daylio) ---- */
function moodStats(habits,a,b){
  const ms=state.moods.filter(m=>m.date>=a&&m.date<=b);
  const avg=ms.length?ms.reduce((s,m)=>s+m.value,0)/ms.length:null;
  const rel=[];
  for(const h of habits){
    let sw=0,nw=0,so=0,no=0;
    for(const u of unitsOf(h)){ if(u.kind!=='day'||u.start<a||u.start>b) continue; const m=getMood(u.start); if(!m) continue; if(u.status==='done'){ sw+=m.value; nw++; } else if(u.status==='missed'){ so+=m.value; no++; } }
    if(nw>=5&&no>=5) rel.push({h,with:sw/nw,without:so/no,diff:sw/nw-so/no,nw,no});
  }
  rel.sort((x,y)=>Math.abs(y.diff)-Math.abs(x.diff));
  return {avg,n:ms.length,rel};
}
const NF1=new Intl.NumberFormat('es-ES',{minimumFractionDigits:1,maximumFractionDigits:1});
const fmtMood=x=>x==null?'—':NF1.format(x);
function moodCard(habits,a,b){
  const s=moodStats(habits,a,b), c=el('section','card'); c.append(h2i('Ánimo','sun'));
  if(!s.n){ c.append(el('div','muted',`Todavía no has anotado el ánimo de ningún día de este periodo. La app te lo pregunta cada día a partir de las ${pad(state.settings.moodHour)}:00.`)); return c; }
  c.append(tilesOf([['Ánimo medio',fmtMood(s.avg),'de 1 a 5'],['Días anotados',String(s.n)]]));
  c.append(heatmap(null,habits,ui.statPeriod,'mood',{mood:true}));
  if(s.rel.length){
    c.append(el('h3','sub-h','Cómo cambia tu ánimo con cada hábito'));
    const ul=el('ul','rel-list');
    for(const r of s.rel.slice(0,8)){ const li=el('li'); const bdg=el('b',r.diff<0?'neg':'',(r.diff>0?'+':r.diff<0?'−':'±')+NF1.format(Math.abs(r.diff))); li.append(bdg,el('span','',`Los días que cumples «${r.h.name}», tu ánimo medio es ${fmtMood(r.with)}; los que no, ${fmtMood(r.without)}.`)); ul.append(li); }
    c.append(ul);
  }
  return c;
}

const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function cellText(c,v){
  if(v==null||v==='') return '';
  if(c.type==='habit') return v.text;
  if(c.type==='pct') return fmtPct(v);
  if(c.type==='pts') return fmtPts(v);
  if(c.type==='date') return fmtDate(v);
  if(c.type==='num') return fmtNum(v);
  return String(v);
}
function sortRows(cols,rows,s){
  const c=cols.find(x=>x.k===s.k); if(!c) return rows;
  const key=r=>{ const v=r[c.k]; if(c.type==='habit') return norm(v.text); if(c.k==='valor') return r.valorN; return v==null||v===''?null:typeof v==='string'?norm(v):v; };
  return rows.slice().sort((x,y)=>{ const p=key(x), q=key(y); if(p==null&&q==null) return 0; if(p==null) return 1; if(q==null) return -1; return (p<q?-1:p>q?1:0)*(s.dir==='asc'?1:-1); });
}

/* CSV para Excel en español: separador «;», coma decimal y BOM */
function exportCSV(id){
  const {cols,rows}=buildTable(id); const s=(ui.sorts||{})[id]; const list=s?sortRows(cols,rows,s):rows;
  const nfc=new Intl.NumberFormat('es-ES',{useGrouping:false,maximumFractionDigits:3});
  const q=x=>{ const t=String(x==null?'':x); return /[";\n\r]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t; };
  const head=cols.map(c=>q(c.label+(c.type==='pct'?' (%)':c.type==='pts'?' (puntos)':''))).join(';');
  const lines=list.map(r=>cols.map(c=>{ const v=r[c.k]; if(v==null||v==='') return ''; if(c.type==='habit') return q(v.text); if(c.type==='pct') return nfc.format(Math.round(v*1000)/10); if(c.type==='pts') return nfc.format(Math.round(v*1000)/10); if(c.type==='num') return nfc.format(v); if(c.k==='valor') return q(nfc.format(r.valorN)); return q(v); }).join(';'));
  download(`habitos-${id}-${today()}.csv`,'﻿'+[head].concat(lines).join('\r\n'),'text/csv;charset=utf-8');
  showToast('💾 Tabla exportada');
}

  async setState(json){ const st=normalizeState(json); if(!st) throw new Error('estado no válido'); state=st; undoStack.length=0; touch(); if(storeMode==='idb') await idbPut(DB_KEY,JSON.stringify(state)); else localStorage.setItem(LS_FALLBACK,JSON.stringify(state)); renderApp(); return true; },
  flush
};
boot();
</script>
