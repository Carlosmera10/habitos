const pctCell=v=>v==null?'':v;
function tierClass(v){ if(v==null) return ''; return v>=0.9?'t4':v>=0.75?'t3':v>=0.5?'t2':v>=0.25?'t1':'t0'; }
/* cols: {k,label,type:'text'|'num'|'pct'|'date',fmt,tier,click} */
function buildTable(id){
  const t=today(), [a,b]=periodBounds(), habits=filteredHabits();
  const hcell=h=>({text:h.name,color:h.color,h});
  let cols=[], rows=[];
  if(id==='resumen'){
    cols=[{k:'h',label:'Hábito',type:'habit'},{k:'tipo',label:'Tipo'},{k:'prog',label:'Programación'},{k:'cat',label:'Categoría'},{k:'racha',label:'Racha',type:'num'},{k:'mejor',label:'Mejor racha',type:'num'},{k:'unidad',label:'Unidad'},
      {k:'p7',label:'7 días',type:'pct'},{k:'p30',label:'30 días',type:'pct'},{k:'p90',label:'90 días',type:'pct'},{k:'p365',label:'365 días',type:'pct'},{k:'pp',label:'Periodo',type:'pct'},{k:'punt',label:'Puntuación',type:'pct'},{k:'reg',label:'Registros',type:'num'},{k:'ult',label:'Último',type:'date'}];
    rows=habits.map(h=>{ const s=computeStats(h), c=state.categories.find(x=>x.id===h.categoryId); return {h:hcell(h),tipo:kindLabel(h),prog:scheduleText(h.schedule),cat:c?c.name:'',racha:s.current,mejor:s.best,unidad:UNIT_NAMES[s.kind][1],p7:s.pct['7'],p30:s.pct['30'],p90:s.pct['90'],p365:s.pct['365'],pp:compliance(h,a,b).value,punt:scoreAt(scoreSeries(h),t),reg:s.total,ult:s.lastLog||''}; });
  } else if(id==='meses'||id==='semanas'){
    let per;
    if(id==='meses') per=monthSeries([],ui.statPeriod).map(x=>({a:ymKey(x.y,x.m)+'-01',b:monthEnd(x.y,x.m),label:x.label+(x.m===0?'':''),full:x.full}));
    else { per=[]; for(let w=weekStartOf(b),i=0;i<16;i++,w=addDaysS(w,-7)){ const dd=parseYMD(w); per.unshift({a:w,b:addDaysS(w,6),label:`${dd.getDate()} ${MON3[dd.getMonth()]}`,full:`Semana del ${fmtDate(w)}`}); } }
    cols=[{k:'h',label:'Hábito',type:'habit'}].concat(per.map((p,i)=>({k:'c'+i,label:p.label,title:p.full,type:'pct',tier:true})),[{k:'media',label:'Media',type:'pct'}]);
    rows=habits.map(h=>{ const r={h:hcell(h)}; const vals=[]; per.forEach((p,i)=>{ const v=p.a>t?null:compliance(h,p.a,p.b).value; r['c'+i]=v; if(v!=null) vals.push(v); }); r.media=vals.length?vals.reduce((x,y)=>x+y,0)/vals.length:null; return r; });
  } else if(id==='diasem'){
    cols=[{k:'h',label:'Hábito',type:'habit'}].concat(orderedDows().map(d=>({k:'d'+d,label:DOW_ABBR[d],title:cap(DOW_NAME[d]),type:'pct',tier:true})),[{k:'mejor',label:'Mejor día'},{k:'peor',label:'Peor día'}]);
    rows=habits.map(h=>{ const wr=weekdayRates(h,a,b), r={h:hcell(h)}; let bi=null,wi=null; wr.forEach((x,i)=>{ r['d'+i]=x.v; if(x.v!=null){ if(bi==null||x.v>wr[bi].v) bi=i; if(wi==null||x.v<wr[wi].v) wi=i; } }); r.mejor=bi==null?'':cap(DOW_NAME[bi]); r.peor=wi==null||wi===bi?'':cap(DOW_NAME[wi]); return r; });
  } else if(id==='grupos'){
    cols=[{k:'g',label:'Grupo'},{k:'tipo',label:'Tipo'},{k:'n',label:'Hábitos',type:'num'},{k:'p30',label:'30 días',type:'pct'},{k:'pp',label:'Periodo',type:'pct'},{k:'reg',label:'Registros',type:'num'}];
    const add=(name,tipo,hs)=>{ if(!hs.length) return; rows.push({g:name,tipo,n:hs.length,p30:globalCompliance(hs,addDaysS(t,-29),t),pp:globalCompliance(hs,a,b),reg:hs.reduce((s,h)=>s+countIn(h,a,b).n,0)}); };
    for(const c of state.categories) add(c.name,'Categoría',habits.filter(h=>h.categoryId===c.id));
    add('Sin categoría','Categoría',habits.filter(h=>!h.categoryId));
    for(const g of state.tags) add('#'+g.name,'Etiqueta',habits.filter(h=>h.tags.includes(g.id)));
  } else if(id==='rachas'){
    cols=[{k:'h',label:'Hábito',type:'habit'},{k:'ini',label:'Inicio',type:'date'},{k:'fin',label:'Fin',type:'date'},{k:'dur',label:'Duración',type:'num'},{k:'uni',label:'Unidad'},{k:'act',label:'Actual'}];
    for(const h of habits){ const s=computeStreaks(h); s.runs.forEach((r,i)=>{ if(r.end<a||r.start>b) return; rows.push({h:hcell(h),ini:r.start,fin:r.end,dur:r.length,uni:UNIT_NAMES[r.kind][1],act:s.current&&i===s.runs.length-1?'Sí':''}); }); }
  } else if(id==='registros'){
    cols=[{k:'fecha',label:'Fecha',type:'date'},{k:'h',label:'Hábito',type:'habit'},{k:'valor',label:'Valor'},{k:'nota',label:'Nota'},{k:'origen',label:'Origen'}];
    const q=norm(ui.regSearch||''), ids=new Set(habits.map(h=>h.id));
    for(const l of state.logs){ if(!ids.has(l.habitId)||l.date<a||l.date>b) continue; const h=habitById(l.habitId); if(q&&!norm(h.name+' '+l.note).includes(q)) continue;
      rows.push({fecha:l.date,h:hcell(h),valor:h.kind==='count'?fmtNum(l.value)+(h.target.unit?' '+h.target.unit:''):h.kind==='avoid'?'Recaída':'Hecho',valorN:l.value,nota:l.note,origen:l.source==='habitica'?'Habitica':'App',_click:()=>openDayDialog(h,l.date)}); }
  } else if(id==='animo'){
    cols=[{k:'fecha',label:'Fecha',type:'date'},{k:'v',label:'Ánimo',type:'num'},{k:'txt',label:'Cómo'},{k:'nota',label:'Nota'},{k:'hechos',label:'Hábitos cumplidos',type:'num'}];
    const act=habits;
    for(const m of state.moods){ if(m.date<a||m.date>b) continue; const g=dayGlobal(m.date,act); rows.push({fecha:m.date,v:m.value,txt:MOODS[m.value-1][1],nota:m.note,hechos:g.done,_click:()=>{ ui.view='today'; selDate=m.date; ui.todayMode='day'; saveUI(); lastView=null; renderApp(); }}); }
  } else if(id==='relaciones'){
    cols=[{k:'si',label:'Si cumples'},{k:'ent',label:'Entonces'},{k:'p1',label:'Ese día',type:'pct'},{k:'p0',label:'Si no',type:'pct'},{k:'dif',label:'Diferencia',type:'pts'},{k:'n',label:'Días',type:'num'}];
    rows=relations(habits,a,b).map(r=>({si:r.a.name,ent:r.b.name,p1:r.p1,p0:r.p0,dif:r.diff,n:r.n}));
  }
  return {cols,rows};
}
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function cellText(c,v){
  if(v==null||v==='') return '';
  if(c.type==='habit') return v.text;
  if(c.type==='pct') return fmtPct(v);
  if(c.type==='pts') return fmtPts(v);
  if(c.type==='date') return fmtDate(v);
  if(c.type==='num') return fmtNum(v);
  return String(v);
}
function sortRows(cols,rows,s){
  const c=cols.find(x=>x.k===s.k); if(!c) return rows;
  const key=r=>{ const v=r[c.k]; if(c.type==='habit') return norm(v.text); if(c.k==='valor') return r.valorN; return v==null||v===''?null:typeof v==='string'?norm(v):v; };
  return rows.slice().sort((x,y)=>{ const p=key(x), q=key(y); if(p==null&&q==null) return 0; if(p==null) return 1; if(q==null) return -1; return (p<q?-1:p>q?1:0)*(s.dir==='asc'?1:-1); });
}
const PAGE=100;
function renderTables(v){
  const head=el('header','page-head'), row=el('div','head-row'), tt=el('div','head-title'); tt.append(el('h1','page-title','Tablas')); row.append(tt);
  const id=TABLES.some(x=>x[0]===ui.table)?ui.table:'resumen';
  const act=el('div','head-actions'); act.append(btn('Exportar CSV','secondary',null,()=>exportCSV(id),'download')); row.append(act);
  head.append(row);
  const tabs=el('div','tabs'); tabs.setAttribute('role','tablist');
  for(const [k,l] of TABLES){ const bb=btn(l,'tab',null,()=>{ ui.table=k; ui.regPage=0; saveUI(); renderApp(); }); bb.setAttribute('role','tab'); bb.setAttribute('aria-selected',String(k===id)); tabs.append(bb); }
  head.append(tabs, filterBar(false));
  v.append(head);
  if(!state.habits.length){ const e=el('div','empty'); e.append(ic('table'),btn('Crear el primer hábito','',null,()=>openHabitEditor(null),'plus')); v.append(e); return; }
  if(id==='registros'){ const s=field('input',{type:'search',value:ui.regSearch||'',placeholder:'Buscar en hábito o nota'}); s.setAttribute('aria-label','Buscar registros'); s.style.maxWidth='320px'; s.style.marginBottom='10px';
    s.addEventListener('input',()=>{ ui.regSearch=s.value; ui.regPage=0; clearTimeout(s._t); s._t=setTimeout(()=>{ renderApp(); const n=document.querySelector('input[type=search]'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } },250); }); v.append(s); }
  const {cols,rows}=buildTable(id);
  const sorts=ui.sorts||{}; const s=sorts[id]||(id==='registros'?{k:'fecha',dir:'desc'}:id==='rachas'?{k:'dur',dir:'desc'}:id==='relaciones'?{k:'dif',dir:'desc'}:{k:cols[0].k,dir:'asc'});
  let list=sortRows(cols,rows,s);
  const total=list.length, pages=Math.max(1,Math.ceil(total/PAGE)), page=Math.min(ui.regPage||0,pages-1);
  if(id==='registros') list=list.slice(page*PAGE,(page+1)*PAGE);
  const wrap=el('div','tscroll'); wrap.dataset.key=id;
  const tb=el('table','dtable'), thead=el('thead'), tr=el('tr');
  for(const c of cols){
    const th=el('th',(['num','pct','pts'].includes(c.type)?'r':'')); const bb=btn(c.label,'th-btn',null,()=>{ const cur=(ui.sorts||{})[id]; ui.sorts=Object.assign({},ui.sorts,{[id]:{k:c.k,dir:cur&&cur.k===c.k&&cur.dir==='desc'?'asc':(cur&&cur.k===c.k?'desc':(['num','pct','pts','date'].includes(c.type)?'desc':'asc'))}}); saveUI(); renderApp(); });
    if(c.title) bb.title=c.title;
    if(s.k===c.k){ th.setAttribute('aria-sort',s.dir==='asc'?'ascending':'descending'); bb.append(ic(s.dir==='asc'?'chev-up':'chev-down','sm')); }
    th.append(bb); tr.append(th);
  }
  thead.append(tr); tb.append(thead);
  const body=el('tbody');
  if(!list.length){ const r=el('tr'), td=el('td','muted','Sin datos con estos filtros'); td.colSpan=cols.length; r.append(td); body.append(r); }
  for(const r of list){
    const trr=el('tr'); if(r._click){ trr.classList.add('clickable'); trr.tabIndex=0; trr.addEventListener('click',r._click); trr.addEventListener('keydown',e=>{ if(e.key==='Enter') r._click(); }); }
    for(const c of cols){
      const v2=r[c.k], td=el('td',(['num','pct','pts'].includes(c.type)?'r':'')+(c.tier?' '+tierClass(v2):''));
      if(c.type==='habit'&&v2){ const bb=btn('','cell-h',null,e=>{ if(r._click) return; e.stopPropagation(); openHabitStats(v2.h); }); bb.style.setProperty('--c',`var(--hc-${v2.color})`); bb.append(el('i','dot'),el('span','',v2.text)); if(r._click) bb.tabIndex=-1; td.append(bb); }
      else td.textContent=cellText(c,v2);
      trr.append(td);
    }
    body.append(trr);
  }
  tb.append(body); wrap.append(tb); v.append(wrap);
  wrap.addEventListener('scroll',()=>{ tblScroll[id]=wrap.scrollLeft; },{passive:true});
  if(tblScroll[id]) wrap.scrollLeft=tblScroll[id];
  const foot=el('div','table-foot'); foot.append(el('span','muted',pl(total,'fila','filas')));
  if(id==='registros'&&pages>1){ const pg=el('div','row'); const pv=btn('','secondary small icon','Página anterior',()=>{ ui.regPage=page-1; renderApp(); },'chev-left'); pv.disabled=page===0; const nx=btn('','secondary small icon','Página siguiente',()=>{ ui.regPage=page+1; renderApp(); },'chev-right'); nx.disabled=page>=pages-1; pg.append(pv,el('span','muted',`${page+1} de ${pages}`),nx); foot.append(pg); }
  v.append(foot);
}
/* CSV para Excel en español: separador «;», coma decimal y BOM */
function exportCSV(id){
  const {cols,rows}=buildTable(id); const s=(ui.sorts||{})[id]; const list=s?sortRows(cols,rows,s):rows;
  const nfc=new Intl.NumberFormat('es-ES',{useGrouping:false,maximumFractionDigits:3});
  const q=x=>{ const t=String(x==null?'':x); return /[";\n\r]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t; };
  const head=cols.map(c=>q(c.label+(c.type==='pct'?' (%)':c.type==='pts'?' (puntos)':''))).join(';');
  const lines=list.map(r=>cols.map(c=>{ const v=r[c.k]; if(v==null||v==='') return ''; if(c.type==='habit') return q(v.text); if(c.type==='pct') return nfc.format(Math.round(v*1000)/10); if(c.type==='pts') return nfc.format(Math.round(v*1000)/10); if(c.type==='num') return nfc.format(v); if(c.k==='valor') return q(nfc.format(r.valorN)); return q(v); }).join(';'));
  download(`habitos-${id}-${today()}.csv`,'﻿'+[head].concat(lines).join('\r\n'),'text/csv;charset=utf-8');
  showToast('💾 Tabla exportada');
}

/* ---- Hoy: varios días (como la lista de Loop) ---- */
function renderDaysGrid(v,d){
  const t=today(), n=isMobile()?4:7, days=[]; for(let i=0;i<n;i++) days.push(addDaysS(d,-i));
  const habits=habitsSorted().filter(h=>!h.archived&&days.some(x=>inRange(h,x)));
  if(!habits.length) return;
  const g=el('div','dgrid'); g.style.setProperty('--n',n);
  g.append(el('div','dg-h'));
  for(const x of days){ const dd=parseYMD(x), hd=el('div','dg-h dg-day'+(x===t?' today':'')); hd.append(el('span','',DOW_ABBR[dd.getDay()]),el('b','',String(dd.getDate()))); g.append(hd); }
  for(const h of habits){
    const nm=btn('','dg-name',`Estadísticas de «${h.name}»`,()=>openHabitStats(h)); nm.style.setProperty('--c',`var(--hc-${h.color})`);
    const rg=el('span','dg-ring'); rg.append(ring(scoreAt(scoreSeries(h),t))); rg.setAttribute('data-tip','Puntuación '+fmtPct0(scoreAt(scoreSeries(h),t)));
    nm.append(rg,el('span','nm',h.name)); g.append(nm);
    for(const x of days){
      const c=el('button','dg-cell'); c.type='button'; c.style.setProperty('--c',`var(--hc-${h.color})`);
      if(!inRange(h,x)){ if(canBackfill(h,x)){ c.classList.add('off','before'); c.append(ic('dot')); c.setAttribute('aria-label',`${h.name}, ${fmtDate(x,true)}: antes del inicio`); c.addEventListener('click',()=>h.kind==='count'?openDayDialog(h,x):toggleDone(h,x)); } else { c.disabled=true; c.classList.add('out'); } g.append(c); continue; }
      const info=habitDay(h,x), log=getLog(h.id,x);
      let lab;
      if(h.kind==='count'){ if(log){ c.append(el('span','qty',fmtNum(log.value))); c.classList.add(info.st==='done'?'on':'part'); lab=fmtNum(log.value); } else if(info.st==='pause'){ c.append(ic('pause')); lab='pausa'; } else { c.append(ic(info.st==='off'?'dot':'x')); c.classList.add(info.st==='off'?'off':'no'); lab='sin registro'; } c.addEventListener('click',()=>openDayDialog(h,x)); }
      else if(h.kind==='avoid'){ if(log){ c.append(ic('x')); c.classList.add('slip'); lab='recaída'; } else if(info.st==='pause'){ c.append(ic('pause')); lab='pausa'; } else if(info.st==='off'){ c.append(ic('dot')); c.classList.add('off'); lab='no tocaba'; } else { c.append(ic('check')); c.classList.add(info.st==='pending'?'soft':'on'); lab='limpio'; } c.addEventListener('click',()=>toggleDone(h,x)); }
      else { if(info.st==='done'){ c.append(ic('check')); c.classList.add('on'); lab='hecho'; } else if(info.st==='pause'){ c.append(ic('pause')); lab='pausa'; } else if(info.st==='off'){ c.append(ic('dot')); c.classList.add('off'); lab='no tocaba'; } else { c.append(ic('x')); c.classList.add('no'); lab='sin hacer'; } c.addEventListener('click',()=>toggleDone(h,x)); }
      c.setAttribute('aria-label',`${h.name}, ${fmtDate(x,true)}: ${lab}`);
      g.append(c);
    }
  }
  v.append(g);
}


/* ---- Días pasados ---- */
let calEdit=false;   // modo Editar del calendario de la ficha (no se guarda)
function quickToggle(h,d){
  hideTip();
  if(d>today()) return;
  if(h.kind==='count'){ if(inRange(h,d)||canBackfill(h,d)) openDayDialog(h,d); return; }
  if(!inRange(h,d)&&!canBackfill(h,d)) return;
  toggleDone(h,d);
}
/* Rellenar un periodo de días pasados de una vez (por ejemplo, al pasar el historial de otra app) */
function openFillDialog(h){
  const t=today(), sc=h.schedule;
  const def=sc.type==='weekdays'?sc.days.slice():[0,1,2,3,4,5,6];
  const sel=new Set(def);
  openDialog(dlg=>{
    dlg.append(modalHeader('Rellenar días · '+h.name,h.icon,h.color));
    const g=el('div','form-grid');
    const a=field('input',{type:'date',value:addDaysS(t,-30),max:t}), b=field('input',{type:'date',value:addDaysS(t,-1),max:t});
    g.append(fld('Desde',a),fld('Hasta',b));
    const dw=el('div','fld full'); dw.append(el('span','lbl','Días de la semana'));
    const dd=el('div','days');
    for(const x of orderedDows()){ const bb=btn(DOW_LETTER[x],'',DOW_NAME[x],()=>{ sel.has(x)?sel.delete(x):sel.add(x); bb.setAttribute('aria-pressed',String(sel.has(x))); }); bb.setAttribute('aria-pressed',String(sel.has(x))); dd.append(bb); }
    dw.append(dd); g.append(dw);
    let qty=null;
    if(h.kind==='count'){ qty=field('input',{type:'text',inputMode:'decimal',value:fmtNum(h.target.amount)}); g.append(fld(`Cantidad por día${h.target.unit?' ('+h.target.unit+')':''}`,qty)); }
    const aw=el('div','fld full'); aw.append(el('span','lbl','Acción'));
    const seg=el('div','seg'); let mode='mark';
    const m1=btn('Marcar como hechos','',null,()=>{ mode='mark'; upd(); },'check'), m2=btn('Borrar registros','',null,()=>{ mode='clear'; upd(); },'trash');
    const upd=()=>{ m1.setAttribute('aria-pressed',String(mode==='mark')); m2.setAttribute('aria-pressed',String(mode==='clear')); if(qty) qty.disabled=mode==='clear'; };
    upd(); seg.append(m1,m2); aw.append(seg); g.append(aw);
    const err=el('div','err full'); g.append(err); dlg.append(g);
    const ft=el('div','modal-footer'); ft.append(el('span'));
    const r=el('div','row'); r.append(btn('Cancelar','secondary',null,closeDialog),btn('Aplicar','',null,()=>{
      if(!validYMD(a.value)||!validYMD(b.value)){ err.textContent='Elige las dos fechas'; return; }
      const to=b.value>t?t:b.value;
      if(to<a.value){ err.textContent='La fecha final no puede ser anterior'; return; }
      if(daysBetween(a.value,to)>3660){ err.textContent='Como máximo diez años de una vez'; return; }
      if(!sel.size){ err.textContent='Elige al menos un día de la semana'; return; }
      let val=1; if(qty&&mode==='mark'){ val=parseNum(qty.value); if(!(val>0)){ err.textContent='Escribe una cantidad mayor que cero'; return; } val=Math.round(val*1000)/1000; }
      if(h.endDate&&a.value>h.endDate){ err.textContent='El hábito terminó antes de esas fechas'; return; }
      closeDialog();
      commit(null,()=>{
        let n=0, moved=false;
        for(let d=a.value; d<=to; d=addDaysS(d,1)){
          if(!sel.has(dowOf(d))||(h.endDate&&d>h.endDate)) continue;
          if(mode==='mark'){ setLog(h.id,d,val); n++; } else if(getLog(h.id,d)){ setLog(h.id,d,0); n++; }
        }
        if(mode==='mark') moved=extendStart(h.id,a.value);
        if(!n) return false;
        return mode==='mark'?`✅ ${pl(n,'día marcado','días marcados')}${moved?'. El hábito empieza ahora el '+fmtDate(a.value):''}`:`🗑️ ${pl(n,'registro borrado','registros borrados')}`;
      });
    },'check'));
    ft.append(r); dlg.append(ft);
  });
}

function renderHelp(v){
  const head=el('header','page-head'); head.append(el('h1','page-title','Instrucciones')); v.append(head);
  const c=el('div','card help');
  const sec=(t,parts)=>{ c.append(el('h2','',t)); for(const p of parts){ if(Array.isArray(p)){ const ul=el('ul'); for(const x of p) ul.append(el('li','',x)); c.append(ul); } else c.append(el('p','',p)); } };
  sec('Hoy',['Muestra los hábitos que tocan el día elegido. Toca el círculo para marcarlo; los de cantidad se suman y restan con + y −. Toca el nombre para abrir el detalle del día: nota, cantidad exacta o pausa.','Con las flechas, el selector de fecha o «Ayer» puedes registrar días pasados. Los hábitos que no tocan ese día están en «No tocan hoy» y también se pueden marcar (no suman a la racha).','Todo cambio se puede deshacer con el botón del aviso o con Ctrl+Z.']);
  sec('Tipos de hábito',[['Sí / no: se marca el día que se hace.','Cantidad: se suma una cantidad (vasos, minutos, páginas…); el día cuenta si llega al objetivo.','Evitar: para dejar algo. Solo se marca el día que se cae (recaída); el resto de días programados cuentan solos como días limpios. Hoy no cuenta hasta que termina, salvo que haya recaída.']]);
  sec('Días pasados',['Puedes registrar cualquier día pasado desde «Hoy» (flechas, selector de fecha o «Ayer»), desde «Varios días», tocando un día del calendario o desde la ficha del hábito.','Si registras un día anterior al inicio del hábito, el inicio se adelanta a ese día. En la ficha, el botón «Editar» del calendario permite marcar y desmarcar días de un toque, y «Rellenar días» marca (o borra) de una vez todos los días de un periodo, eligiendo los días de la semana: útil para pasar el historial de otra app.','En los hábitos «Evitar», los días anteriores al inicio no se rellenan solos: para adelantar el inicio, cambia «Empieza» en el editor.']);
  sec('Sincronización',['En Ajustes y avisos → Sincronización pegas un token de GitHub (sirve el del Revisor de Tareas) y eliges una contraseña de cifrado. Repite lo mismo en el otro dispositivo con el mismo token y la misma contraseña.','Los datos se guardan cifrados en un Gist secreto de tu cuenta. Se sincroniza al abrir la app, unos segundos después de cada cambio, al volver a la app y cada 3 minutos. En cada hábito, registro o pausa prevalece la versión más reciente, y los borrados también se propagan. No se sincronizan los ajustes ni la interfaz.','Si ves un punto rojo en Ajustes, la sincronización está en pausa (token caducado, contraseña incorrecta…): ábrelo para ver el motivo.']);
  sec('Hoy en varios días',['El botón «Varios días» de «Hoy» muestra los hábitos en filas y los últimos días en columnas (4 en el móvil, 7 en el PC). Toca una casilla para marcarla o desmarcarla; en los de cantidad se abre el detalle. Toca el nombre para ver sus estadísticas.']);
  sec('Calendario',['Con «Todos los hábitos», cada día toma el color de los hábitos que tocaban: todos cumplidos, algunos, ninguno, pausa o no tocaba. Los hábitos de «X veces por semana» y los registros de días que no tocaban solo suman si se hicieron. Toca un día para abrirlo en «Hoy» y editarlo.','Con un hábito elegido se ve cada día: hecho, parcial (cantidad por debajo del objetivo), no cumplido, pausa o no tocaba. En los de «X veces por semana», la última columna muestra la cuota de cada semana. Toca un día para editar su registro.']);
  sec('Ficha del hábito',['Al elegir un hábito en Estadísticas (o tocar su nombre) se ve su ficha: puntuación, historial, calendario, mejores rachas, frecuencia por día de la semana y mes, cumplimiento por día de la semana y por mes y, en los de cantidad, la media diaria frente al objetivo.','La puntuación mide la fuerza del hábito, como en Loop: es una media de lo cumplido en la que pesan más los días recientes (lo de hace unas 2 semanas cuenta la mitad en un hábito diario; en uno menos frecuente, la memoria es más larga). Los días de pausa y los que no tocan no la cambian.']);
  sec('Tablas',['Resumen, meses, semanas, días de la semana, categorías y etiquetas, rachas, registros y relaciones entre hábitos. Toca una cabecera para ordenar; «Exportar CSV» guarda la tabla para Excel (separador «;» y coma decimal). En «Registros», toca una fila para editarla.','«Relaciones» compara, para cada pareja de hábitos, cuánto cumples el segundo los días que cumples el primero frente a los días que no.']);
  sec('Estadísticas',['Cifras, cumplimiento por mes y cuadrícula del periodo elegido (últimos 12 meses o un año). Con «Todos los hábitos», el cumplimiento es la media de los hábitos que tocaban. Pasa el ratón por una barra o un día para ver el detalle; «Ver tabla» muestra los valores del gráfico. «Incluir archivados» añade los hábitos archivados.']);
  sec('Tipos de programación',['Días fijos:',[
    'Todos los días.',
    'Días de la semana: solo los elegidos. Los demás días ni suman ni rompen la racha.',
    'Días del mes: por ejemplo el 1 y el 15. Si eliges el 29, 30 o 31 y el mes no lo tiene, toca el último día.',
    'Cada N días: cada N días desde la fecha de inicio (o desde el día en que se cambió la programación).'],'Cuotas (cualquier día, hasta cumplir el número de veces):',[
    'Veces por semana, veces al mes (mes natural) y veces al año (año natural).',
    'Veces cada N días: periodos seguidos de N días contados desde el inicio; por ejemplo, 7 veces cada 14 días.',
    'La racha cuenta periodos seguidos cumplidos (semanas, meses, años o periodos). El periodo en curso no rompe mientras aún se pueda cumplir, y el primero incompleto solo suma si se cumple. Un día con varios registros cuenta uno.']]);
  sec('Para hacerlo fácil',['Ideas de «Hábitos atómicos» y de apps como Atoms, Productive o Daylio:',[
    'Plantilla: al crear un hábito, elige una para rellenarlo de una vez.',
    'Momento del día (mañana, tarde, noche): «Hoy» agrupa los hábitos por momento.',
    'Cuándo (señal): por ejemplo «Después del café». Se ve en «Hoy» mientras está pendiente.',
    'Versión mínima: lo mínimo para no romper la cadena en un mal día. En el detalle del día, «Versión mínima» cuenta como hecho y queda anotado.',
    'Por qué: la persona que quieres ser. Se ve en la ficha del hábito.',
    'No falles dos veces: si el último día que tocaba no se cumplió, «Hoy» lo avisa.',
    'Hitos: al llegar a 3, 7, 14, 21, 30, 50, 66, 100… días (o semanas, meses…) seguidos, y cuando completas todo el día, aparece un aviso de celebración.',
    'Ánimo del día: al final de «Hoy», de 1 (muy mal) a 5 (muy bien), con una nota. En Estadísticas verás tu año por colores y cómo cambia tu ánimo los días que cumples cada hábito. Se puede quitar en Ajustes.']]);
  sec('Rachas',[[
    'Diario, días concretos y cada N días: días programados seguidos cumplidos. Hoy sin marcar no rompe la racha; se rompe cuando pasa un día programado sin cumplir.',
    'X veces por semana: semanas seguidas con la cuota cumplida. La semana en curso no rompe mientras aún se pueda cumplir. La primera semana incompleta del hábito solo suma si se cumple.',
    'Los días de pausa ni suman ni rompen.',
    'Si cambias la programación, los días anteriores se calculan con la programación que tenían entonces.']]);
  sec('Cumplimiento',['Días cumplidos entre días programados (sin pausas, sin días anteriores al inicio y sin contar hoy si aún no está hecho). En «X veces por semana», cada semana completa vale lo registrado entre la cuota (máximo 100 %) y se hace la media; la primera semana incompleta no cuenta.']);
  sec('Pausas',['Desde el detalle del día («Día de pausa») o desde Hábitos → «Pausar días» para un periodo, de un hábito o de todos. Para quitar una pausa, bórrala de la lista de pausas.']);
  sec('Archivar y borrar',['Archivar quita el hábito de «Hoy» pero conserva su historial. Borrar elimina el hábito y todos sus registros (se puede deshacer justo después).']);
  sec('Copias de seguridad',['Ajustes y avisos → Exportar guarda un archivo JSON. Importar permite «Fusionar» (por cada hábito, registro o pausa gana la versión más reciente y lo borrado no reaparece) o «Sustituir todo». Sirve también para pasar los datos del PC al móvil.','Los datos se guardan solo en este navegador. No uses «Borrar datos del sitio» de Chrome: borraría también las otras apps publicadas en la misma dirección. Para empezar de cero, usa «Vaciar» en Ajustes.']);
  sec('Instalar',['PC (Chrome): icono de instalar de la barra de direcciones o menú ⋮ → «Transmitir, guardar y compartir» → «Instalar página como aplicación…».','Android (Chrome): menú ⋮ → «Instalar aplicación» (o «Añadir a la pantalla de inicio» → «Instalar»).','No hay avisos con la app cerrada: el aviso de pendientes aparece al abrirla.']);
  v.append(c);
}

/* ================= Instalación, teclado y arranque ================= */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; $('installBtn').hidden=false; if(ui.view==='settings') renderApp(); });
window.addEventListener('appinstalled',()=>{ deferredPrompt=null; $('installBtn').hidden=true; });
async function installApp(){ if(!deferredPrompt) return; deferredPrompt.prompt(); try{ await deferredPrompt.userChoice; }catch(e){} deferredPrompt=null; $('installBtn').hidden=true; renderApp(); }
$('installBtn').addEventListener('click',installApp);
document.addEventListener('keydown',e=>{
  const tg=e.target, typing=tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.tagName==='SELECT'||tg.isContentEditable);
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'&&!typing&&!$('dlg').open){ e.preventDefault(); undo(); }
});
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'){ if(pendingSave()) flush(); } else checkDayChange(); });
window.addEventListener('pagehide',()=>{ if(pendingSave()) flush(); });
let shownDay=null;
function checkDayChange(){ if(ready&&shownDay!==today()){ shownDay=today(); touch(); renderApp(); } }
setInterval(checkDayChange,60000);

function startupNotice(){
  if(!state.settings.notifyPending) return;
  const t=today(), pend=state.habits.filter(h=>{ if(h.archived||!inRange(h,t)) return false; const s=dayStatus(h,t); return s.counts&&!s.done&&!(s.kind==='period'&&s.met)&&(s.kind==='period'||s.scheduled); }).length;
  if(pend) showToast(`🔔 ${pend===1?'Tienes 1 hábito pendiente hoy':`Tienes ${pend} hábitos pendientes hoy`}`,{timeout:6000});
}
async function boot(){
  applyTheme();
  let st=null;
  try{ st=await loadStored(); }
  catch(e){ storeMode='ls'; try{ st=normalizeState(localStorage.getItem(LS_FALLBACK)); }catch(_){} }
  const first=!st;
  state=st||defaultState(); ready=true; shownDay=today(); touch();
  if(first){
    await flush();
    try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  }
  renderApp();
  startupNotice();
  if(syncCfg){ startSyncTimer(); syncNow(); }
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!/[?&]nosw\b/.test(location.search)){
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});
  }
}

/* ================= Ganchos de prueba ================= */
window.__habitos={
  get state(){ return state; },
  normalizeState, normalizeItem:(x)=>normalizeItem(x,{catIds:new Set(state.categories.map(c=>c.id)),tagIds:new Set(state.tags.map(g=>g.id)),idx:0}),
  isDue, isScheduled, moodStats, scoreSeries, scoreAt, relations, weekdayRates, buildTable, dayGlobal, habitDay, monthCompliance, globalCompliance, computeStreaks, computeStats, compliance, unitsOf, mergeStates, undo, commit, exportData, parseNum,
  syncNow, get syncCfg(){ return syncCfg; }, fingerprint,
  setToday(s){ todayOverride=s||null; touch(); renderApp(); },
  async setState(json){ const st=normalizeState(json); if(!st) throw new Error('estado no válido'); state=st; undoStack.length=0; touch(); if(storeMode==='idb') await idbPut(DB_KEY,JSON.stringify(state)); else localStorage.setItem(LS_FALLBACK,JSON.stringify(state)); renderApp(); return true; },
  flush
};
boot();
</script>
