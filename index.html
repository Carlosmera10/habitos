<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f4ef">
<meta name="description" content="Seguimiento de hábitos con rachas, pausas y estadísticas.">
<link rel="manifest" href="app.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Hábitos</title>
<script>(function(){try{var u=JSON.parse(localStorage.getItem('habitos_v1_ui')||'{}'),t=u.theme;if(t!=='light'&&t!=='dark')t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;if(u.side==='closed')document.documentElement.classList.add('side-closed');var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#121714':'#f3f4ef';}catch(e){}})();</script>
<style>
:root{color-scheme:light;
  --paper:#f3f4ef;--panel:#fbfbf8;--ink:#1e2621;--ink-2:#3d4842;--muted:#626d66;--faint:#8f9891;--line:#dfe3da;--line-strong:#c5ccc1;
  --accent:#24543f;--accent-ink:#1a3f2f;--accent-soft:#e3ece5;--accent-line:#b5cbbd;
  --field:#fff;--hover:#eceee7;--chip:#e8ebe4;--chip-ink:#3d4842;--subtle:#f0f2ec;--track:#e2e6de;
  --head-bg:rgba(243,244,239,.92);--warn-bg:#fbf3d0;--warn-line:#e9d88a;--warn-ink:#5c4a00;
  --danger:#b0442f;--danger-soft:#f8e7e2;--danger-line:#e9c3b8;--disabled-bg:#eef0ea;
  --done:#2e7d58;--done-soft:#e2f0e7;--done-line:#b6d8c3;--miss-soft:#f7e4de;--miss-line:#ecc6bb;
  --heat-off:#e9ece5;--heat-0:#f0d3cb;--heat-1:#cfe6d6;--heat-2:#93c9a8;--heat-3:#4f9e74;--heat-4:#2e7d58;
  --flame:#c86a1a;--pause:#626d66;--pause-soft:#e8ebe4;
  --mark:#f2d64b;--mark-soft:#fbf1bd;--dot:#d3d9cf;--hab-hp:#c4463b;--hab-xp:#c99400;--hab-mp:#3a6db0;--hv-1:#8c1c1c;--hv-2:#d13b3b;--hv-3:#e8833a;--hv-4:#e8c43a;--hv-5:#3f9d5a;--hv-6:#4fb0c6;--hv-7:#3466b5;
  --nav:#1e2621;--nav-ink:#fbfbf8;
  --m1:#c8553d;--m2:#e0a066;--m3:#b5bab1;--m4:#86c095;--m5:#2e7d58;
  --hc-c1:#3b5fa8;--hc-c2:#2e7d58;--hc-c3:#c0453a;--hc-c4:#cf7629;--hc-c5:#7a52a8;--hc-c6:#1f8686;--hc-c7:#b84a7d;--hc-c8:#97781f;--hc-c9:#56665f;--hc-c10:#5f9426;
  --topbar-h:60px;
  --st-int:#3b5fa8;--st-per:#7a52a8;--st-con:#b86a1f;--st-str:#c0453a;--stage:#1e2621;--stage-2:#2c352f;--stage-ink:#f3f4ef;--stage-mute:#c5cdc6;
  --font:system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
:root[data-theme=dark]{color-scheme:dark;
  --paper:#121714;--panel:#1a201c;--field:#151a17;--ink:#e6ebe5;--ink-2:#c5cdc6;--muted:#9aa59d;--faint:#6f7a72;--line:#2a322d;--line-strong:#3a443e;
  --accent:#8fd0ad;--accent-ink:#a9dfc2;--accent-soft:#203329;--accent-line:#2f5240;
  --hover:#212922;--chip:#232b25;--chip-ink:#c5cdc6;--subtle:#161c18;--track:#28302a;
  --head-bg:rgba(18,23,20,.9);--warn-bg:#2d2914;--warn-line:#57501f;--warn-ink:#efe0a0;
  --danger:#f08a74;--danger-soft:#3a201b;--danger-line:#5c2f27;--disabled-bg:#1c221e;
  --done:#56b885;--done-soft:#17291f;--done-line:#2a4a37;--miss-soft:#36211d;--miss-line:#553129;
  --heat-off:#1d241f;--heat-0:#4a2c27;--heat-1:#1d4430;--heat-2:#286b47;--heat-3:#36935f;--heat-4:#5cc48d;
  --flame:#f0a352;--pause:#9aa59d;--pause-soft:#232b25;
  --mark:#d9c048;--mark-soft:#3a3519;--dot:#222a24;--hab-hp:#e0675d;--hab-xp:#dcb43a;--hab-mp:#6d9be0;
  --nav:#e6ebe5;--nav-ink:#121714;
  --m1:#e07a62;--m2:#e6ad78;--m3:#7b847d;--m4:#7cc391;--m5:#56b885;
  --hc-c1:#7e9be0;--hc-c2:#56b885;--hc-c3:#ec7a6c;--hc-c4:#eda15a;--hc-c5:#b18fe3;--hc-c6:#4fc0bd;--hc-c7:#e47fae;--hc-c8:#d3b257;--hc-c9:#98a8a1;--hc-c10:#9bcd5e;
  --st-int:#7e9be0;--st-per:#b18fe3;--st-con:#eda15a;--st-str:#ec7a6c;--stage:#0b0f0d;--stage-2:#1d2420;--stage-ink:#e6ebe5;--stage-mute:#a9b3ab}
:root[data-theme=dark] dialog::backdrop{background:rgba(0,0,0,.6)}
:root[data-theme=dark] .toast,:root[data-theme=dark] .bottom-nav{border:1px solid var(--line-strong)}
:root[data-theme=dark] .bottom-nav{border-width:1px 0 0}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 var(--font);background:var(--paper);color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
h1,h2,h3{margin:0}
.ic{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:15px;height:15px}
.ic.lg{width:22px;height:22px}

/* Botones y campos */
button{font:inherit;font-weight:600;border:1px solid transparent;border-radius:8px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--accent);color:#fff;line-height:1.25;transition:background .15s,color .15s,border-color .15s;-webkit-tap-highlight-color:transparent}
button:hover{background:var(--accent-ink)}
button.secondary{background:var(--panel);color:var(--ink);border-color:var(--line-strong)}
button.secondary:hover{background:var(--hover)}
button.ghost{background:transparent;color:var(--muted)}
button.ghost:hover{background:var(--hover);color:var(--ink)}
button.danger{background:var(--panel);color:var(--danger);border-color:var(--danger-line)}
button.danger:hover{background:var(--danger-soft)}
button.ghost.danger{border-color:transparent;background:transparent}
button.ghost.danger:hover{background:var(--danger-soft)}
button.icon{padding:0;width:34px;height:34px}
button.small{padding:6px 10px;font-size:.86rem}
button.small.icon{width:30px;height:30px}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input.field,select.field,textarea.field{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;min-width:0;width:100%}
input.field:focus,select.field:focus,textarea.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input.field:disabled,select.field:disabled{background:var(--disabled-bg);color:var(--faint)}
textarea.field{resize:vertical;min-height:80px}
input.num{width:96px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--panel);max-width:100%;flex-wrap:wrap}
.seg button{border-radius:0;background:var(--panel);color:var(--muted);border:0;padding:7px 12px;font-size:.88rem}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button.active,.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent)}

/* Estructura */
.app-layout{display:flex;align-items:flex-start;min-height:100vh}
main{flex:1;min-width:0;padding:0 32px 64px;max-width:980px;margin:0 auto}

/* Barra lateral */
.brand{display:flex;align-items:center;gap:10px;padding:2px 4px 20px 8px;color:#fff;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--done);display:grid;place-items:center;color:#fff;flex-shrink:0}
.brand .name{flex:1;overflow:hidden}
.brand button{background:transparent;color:var(--nav-muted);width:30px;height:30px;padding:0}
.brand button:hover{background:var(--nav-hover);color:#fff}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;color:var(--nav-ink);background:transparent;font-weight:500;justify-content:flex-start;text-align:left;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:var(--nav-hover)}
.nav-item.active{background:var(--nav-active);color:#fff;box-shadow:inset 3px 0 0 #8fa6ff}
.nav-count{margin-left:auto;font-size:.76rem;font-weight:600;color:var(--nav-muted);background:rgba(255,255,255,.07);padding:1px 8px;border-radius:99px;flex-shrink:0}
.nav-count.complete{color:#9fdcbb}
.nav-list{display:flex;flex-direction:column;gap:2px;flex:1}
.side-actions{display:flex;flex-direction:column;gap:2px;margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}
.side-actions .install{background:var(--accent);color:#fff;margin-top:6px}

/* Cabecera */
.page-head{position:sticky;top:0;z-index:100;background:var(--head-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:22px 0 14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head-title{flex:1;min-width:200px}
.big-title{font-weight:700;font-size:clamp(1.9rem,4.2vw,2.8rem);line-height:1;letter-spacing:-.04em}
.page-title{font-weight:700;font-size:clamp(1.45rem,3vw,2rem);line-height:1.15;letter-spacing:-.025em}
.sub-date{font-size:clamp(1rem,1.8vw,1.15rem);color:var(--muted);margin-top:6px;letter-spacing:-.01em}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.date-nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.date-nav input.field{width:auto;padding:6px 10px}
.progress{display:flex;align-items:center;gap:14px;margin-top:14px;font-size:.88rem;color:var(--muted)}
.track{flex:1;height:6px;background:var(--track);border-radius:99px;overflow:hidden}
.bar{height:100%;width:0;background:var(--done);border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.pct{font-weight:700;color:var(--ink);min-width:52px;text-align:right}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:.92rem}
.banner span{display:flex;align-items:center;gap:8px}
.banner .row{gap:6px}

/* Lista de Hoy */
.hlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hrow{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 12px;min-height:62px}
.hrow .hc{--c:var(--hc-c1)}
.hcheck{width:38px;height:38px;border-radius:50%;padding:0;background:transparent;border:2px solid var(--c);color:var(--c);flex-shrink:0}
.hcheck:hover{background:var(--hover)}
.hcheck .ic{opacity:0;width:20px;height:20px;stroke-width:2.6}
.hcheck[aria-pressed=true]{background:var(--c);color:#fff}
.hcheck[aria-pressed=true] .ic{opacity:1}
.hcheck.met{border-style:dashed}
.hcheck.avoid .ic{opacity:.35}
.hcheck.avoid[aria-pressed=true]{background:var(--danger);border-color:var(--danger);color:#fff}
.hcheck.avoid[aria-pressed=true] .ic{opacity:1}
.chip.clean{background:var(--done-soft);color:var(--done)}
.chip.slip{background:var(--danger-soft);color:var(--danger)}
.hring{width:38px;height:38px;flex-shrink:0;display:grid;place-items:center;border-radius:50%;color:var(--c)}
.hring svg{width:38px;height:38px}
.hbody{flex:1;min-width:0;cursor:pointer;padding:2px 0}
.hname{font-weight:600;display:flex;align-items:center;gap:7px;min-width:0}
.hname .ic{color:var(--c)}
.hname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hmeta{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:2px;align-items:center}
.hmeta>span{display:inline-flex;align-items:center;gap:4px}
.hmeta .ic{width:14px;height:14px}
.streak{color:var(--flame);font-weight:600}
.streak.zero{color:var(--faint);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--chip);color:var(--chip-ink);border-radius:99px;padding:1px 8px;font-size:.78rem;font-weight:600}
.chip.pause{background:var(--pause-soft);color:var(--pause)}
.hrow.done .hname span{color:var(--muted)}
.hrow.paused{background:var(--subtle);border-style:dashed}
.counter{display:flex;align-items:center;gap:4px;flex-shrink:0}
.counter button{width:34px;height:34px;padding:0;border-radius:50%;background:var(--chip);color:var(--ink)}
.counter button:hover{background:var(--hover)}
.counter .cval{width:auto;min-width:64px;border-radius:8px;background:transparent;font-variant-numeric:tabular-nums;padding:0 6px;font-weight:700;color:var(--ink)}
.counter .cval small{font-weight:500;color:var(--muted);margin-left:3px}
.section-toggle{margin:18px 0 8px;color:var(--muted);font-weight:600;font-size:.9rem;background:transparent;padding:6px 4px}
.section-toggle:hover{background:transparent;color:var(--ink)}
.section-title{margin:26px 0 10px;font-size:1.02rem;font-weight:700;display:flex;align-items:center;gap:8px}
.empty{background:var(--panel);border:1px dashed var(--line-strong);border-radius:12px;padding:28px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted);text-align:center}
.empty .ic{width:30px;height:30px;color:var(--faint)}

/* Hábitos */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar select.field{width:auto;max-width:220px}
.check-label{display:inline-flex;align-items:center;gap:7px;font-size:.92rem;color:var(--ink-2);cursor:pointer;user-select:none}
.check-label input{width:17px;height:17px;accent-color:var(--accent);margin:0}
.hcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.hcard.archived{opacity:.7;border-style:dashed}
.hicon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--c);color:#fff}
.hicon .ic{width:20px;height:20px}
.hcard .tools{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.stats-line{grid-column:2/4;display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.stats-line b{color:var(--ink);font-weight:700}
.pause-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pause-list li{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px}
.pause-list .grow{flex:1;min-width:0}
.pause-list .when{font-weight:600}
.pause-list .who{font-size:.84rem;color:var(--muted)}

/* Ajustes e instrucciones */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card h2{font-size:1.02rem;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.set-row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row>label,.set-row>.lbl{font-weight:500}
.edit-list{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px}
.edit-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center}
.edit-list .tools{display:flex;gap:2px}
.add-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
.help{line-height:1.6}
.help h2{font-size:1.05rem;margin:22px 0 6px}
.help p,.help ul{margin:0 0 8px;color:var(--ink-2)}
.help li{margin-bottom:4px}
.small-print{font-size:.82rem;color:var(--faint);margin-top:6px}

/* Diálogos */
dialog{border:1px solid var(--line);border-radius:14px;padding:20px 22px;width:95%;max-width:560px;box-shadow:0 24px 64px rgba(10,16,30,.28);background:var(--panel);color:var(--ink);max-height:90vh;overflow-y:auto;overflow-x:hidden}
dialog::backdrop{background:rgba(18,26,44,.5);backdrop-filter:blur(3px)}
.modal-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.modal-header h2{font-size:1.15rem;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;min-width:0}
.modal-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
.modal-footer .row{gap:8px}
.modal-footer>.row:last-child{margin-left:auto}
.after-list{margin-top:16px}
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.form-grid .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label,.fld>.lbl{font-size:.84rem;font-weight:600;color:var(--ink-2)}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatch{width:30px;height:30px;border-radius:50%;padding:0;background:var(--c);border:2px solid transparent}
.swatch:hover{background:var(--c);filter:brightness(1.08)}
.swatch[aria-pressed=true]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--c)}
.icon-pick{display:flex;flex-wrap:wrap;gap:4px}
.icon-pick button{width:36px;height:36px;padding:0;background:var(--chip);color:var(--ink-2)}
.icon-pick button:hover{background:var(--hover)}
.icon-pick button[aria-pressed=true]{background:var(--c);color:#fff}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{width:38px;height:38px;padding:0;border-radius:50%;background:var(--chip);color:var(--ink-2)}
.days button[aria-pressed=true]{background:var(--accent);color:#fff}
.mdays{display:grid;grid-template-columns:repeat(7,minmax(0,40px));gap:4px}
.mdays button{height:36px;padding:0;border-radius:8px;background:var(--chip);color:var(--ink-2);font-size:.86rem}
.mdays button[aria-pressed=true]{background:var(--accent);color:#fff}
.sched-x{margin-top:8px}
.tag-pick{display:flex;flex-wrap:wrap;gap:6px}
.tag-pick button{padding:4px 10px;font-size:.84rem;border-radius:99px;background:var(--chip);color:var(--chip-ink)}
.tag-pick button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.err{color:var(--danger);font-size:.86rem;min-height:1.2em}
.stepper{display:flex;align-items:center;gap:6px}
.stepper input.field{width:110px;text-align:center}
.stepper button{width:38px;height:38px;padding:0;border-radius:50%;background:var(--chip);color:var(--ink)}

/* Calendario */
.cal-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav .mname{font-weight:700;font-size:1.08rem;min-width:170px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal.wk{grid-template-columns:repeat(7,minmax(0,1fr)) 52px}
.cal .dow{font-size:.76rem;font-weight:600;color:var(--muted);text-align:center;padding:2px 0 4px;text-transform:uppercase}
.cday{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;min-height:68px;padding:6px 7px;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-weight:600;text-align:left;line-height:1.1}
.cday:hover{background:var(--hover)}
.cday .n{font-size:.92rem}
.cday .s{font-size:.74rem;font-weight:600;color:var(--muted);align-self:flex-end;display:flex;align-items:center;gap:3px}
.cday .s .ic{width:13px;height:13px}
.cday.empty{visibility:hidden}
.cday.future{opacity:.45;cursor:default}
.cday.future:hover{background:var(--panel)}
.cday.today{box-shadow:0 0 0 2px var(--accent);border-color:transparent}
.cday.st-all{background:var(--done);border-color:var(--done);color:#fff}
.cday.st-all .s{color:#fff}
.cday.st-some{background:var(--done-soft);border-color:var(--done-line)}
.cday.st-none{background:var(--miss-soft);border-color:var(--miss-line)}
.cday.st-pause{background:var(--pause-soft);border-style:dashed}
.cday.st-off,.cday.st-out{background:var(--subtle);color:var(--faint)}
.cday.h-done{background:var(--c);border-color:var(--c);color:#fff}
.cday.h-done .s{color:#fff}
.cday.h-partial{background:color-mix(in srgb,var(--c) 22%,var(--panel));border-color:color-mix(in srgb,var(--c) 45%,var(--panel))}
.cday.h-missed{background:var(--miss-soft);border-color:var(--miss-line)}
.cday.h-pause{background:var(--pause-soft);border-style:dashed}
.cday.h-off,.cday.h-free,.cday.h-out{background:var(--subtle);color:var(--faint)}
.cday.h-pending{background:var(--panel)}
.cwk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:8px;font-size:.76rem;font-weight:700;color:var(--muted);background:var(--subtle);border:1px solid var(--line)}
.cwk.done{color:var(--done);background:var(--done-soft);border-color:var(--done-line)}
.cwk.missed{color:var(--danger);background:var(--miss-soft);border-color:var(--miss-line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 0;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--line)}

/* Cuadrícula anual */
.hm{display:flex;gap:6px;align-items:flex-start}
.hm{--hm:12px}
.hm-days{display:grid;grid-template-rows:16px repeat(7,var(--hm));row-gap:2px;font-size:.66rem;color:var(--muted);line-height:var(--hm);flex-shrink:0}
.hm-scroll{overflow-x:auto;overflow-y:hidden;flex:1;min-width:0;padding-bottom:6px;scrollbar-width:thin}
.hm-months{position:relative;height:16px;font-size:.66rem;color:var(--muted)}
.hm-months span{position:absolute;top:0;white-space:nowrap}
.hm-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,var(--hm));grid-auto-columns:var(--hm);gap:2px}
.hm-grid b{border-radius:3px;background:var(--heat-off);cursor:pointer}
.hm-grid b.x{visibility:hidden}
.hm-grid b.fut{background:transparent;cursor:default;box-shadow:inset 0 0 0 1px var(--line)}
.hm-grid b.l0{background:var(--heat-0)}
.hm-grid b.l1{background:var(--heat-1)}
.hm-grid b.l2{background:var(--heat-2)}
.hm-grid b.l3{background:var(--heat-3)}
.hm-grid b.l4{background:var(--heat-4)}
.hm-grid b.pa{background:var(--pause-soft);box-shadow:inset 0 0 0 1px var(--pause)}
.hm-grid b.hd{background:var(--c)}
.hm-grid b.hp{background:color-mix(in srgb,var(--c) 40%,var(--heat-off))}
.hm-grid b.today{box-shadow:0 0 0 1.5px var(--ink)}

/* Estadísticas */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .lbl{font-size:.82rem;color:var(--muted)}
.tile .val{font-size:1.5rem;font-weight:650;letter-spacing:-.02em;margin-top:2px}
.tile .sub{font-size:.78rem;color:var(--faint)}
.chart-card .chart{width:100%}
.chart svg{display:block;overflow:visible}
.chart .ax{fill:var(--muted);font-size:11px}
.chart .vl{fill:var(--ink);font-size:11px;font-weight:600}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .bar{cursor:pointer}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover+.bar,.chart .bar:hover{opacity:.82}
details.tview{margin-top:10px}
details.tview summary{cursor:pointer;color:var(--muted);font-size:.86rem;font-weight:600}
table.simple{border-collapse:collapse;margin-top:8px;font-size:.86rem;min-width:260px}
table.simple th,table.simple td{padding:5px 10px;border-bottom:1px solid var(--line);text-align:left}
table.simple td.r,table.simple th.r{text-align:right}
.tip{position:fixed;z-index:400;pointer-events:none;background:var(--nav);color:#fff;font-size:.8rem;padding:6px 9px;border-radius:7px;max-width:260px;box-shadow:0 8px 20px rgba(10,16,30,.25);white-space:pre-line}
.menu-list{display:flex;flex-direction:column;gap:4px}
.menu-list button{justify-content:flex-start;background:transparent;color:var(--ink);padding:12px 10px;font-size:1rem}
.menu-list button:hover{background:var(--hover)}

/* Fase 3: filtros, ficha, gráficos, tablas y varios días */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.filters select.field{width:auto;max-width:220px;padding:7px 10px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.card-head h2{margin:0}
select.field.mini{width:auto;padding:5px 8px;font-size:.86rem}
.chart .refl{stroke:var(--ink-2);stroke-width:1;opacity:.6}
.hinfo-top{display:flex;gap:12px;align-items:center}
.hinfo .hname{font-size:1.1rem}
.hdesc{margin:12px 0 0;color:var(--ink-2)}
.summary{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));gap:10px;align-items:center}
.sring{width:64px;height:64px;color:var(--c)}
.sring svg{width:64px;height:64px}
.fig{display:flex;flex-direction:column;gap:2px;min-width:0}
.fig b{font-size:1.25rem;font-weight:650;color:var(--c);letter-spacing:-.01em}
.fig span{font-size:.8rem;color:var(--muted)}
.streaks{display:flex;flex-direction:column;gap:6px}
.srow{display:grid;align-items:center;gap:10px}
.sd{font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sd.l{text-align:right}
.sbar{background:var(--chip);color:var(--ink);text-align:center;font-weight:700;font-size:.86rem;border-radius:4px;padding:3px 0;min-width:28px}
.sbar.mid{background:color-mix(in srgb,var(--c) 40%,var(--panel))}
.sbar.top{background:var(--c);color:#fff}
.hbars{display:flex;flex-direction:column;gap:6px}
.hb{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr) 80px;gap:10px;align-items:center}
.hb-name{display:flex;align-items:center;gap:7px;min-width:0;justify-content:flex-start;background:transparent;color:var(--ink);padding:2px 0;font-weight:500;text-align:left}
.hb-name:hover{background:transparent;text-decoration:underline}
.hb-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
span.hb-name{font-weight:500}
i.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);flex-shrink:0}
.hb-track{height:10px;background:var(--track);border-radius:99px;overflow:hidden}
.hb-fill{height:100%;background:var(--c);border-radius:0 4px 4px 0}
.hb-val{font-size:.86rem;font-weight:600;text-align:right;white-space:nowrap}
.cmp-pick{margin-top:10px}
.cmp-pick button[aria-pressed=true]{background:var(--chip);color:var(--ink);border-color:var(--c)}
.cmp-pick button[aria-pressed=false] i.dot{opacity:.35}
.rel-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rel-list li{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:baseline;font-size:.92rem;color:var(--ink-2)}
.rel-list b{color:var(--done);font-size:1rem}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-top:12px}
.tab{background:transparent;color:var(--muted);padding:6px 12px;border-radius:99px;font-size:.88rem}
.tab:hover{background:var(--hover);color:var(--ink)}
.tab[aria-selected=true]{background:var(--accent-soft);color:var(--accent)}
.tscroll{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:100%}
.dtable{border-collapse:separate;border-spacing:0;width:100%;font-size:.86rem}
.dtable th{position:sticky;top:0;background:var(--subtle);text-align:left;padding:0;border-bottom:1px solid var(--line);white-space:nowrap}
.dtable th.r{text-align:right}
.th-btn{background:transparent;color:var(--ink-2);font-size:.82rem;padding:8px 10px;width:100%;justify-content:inherit;gap:4px;border-radius:0}
.dtable th.r .th-btn{justify-content:flex-end}
.dtable th:not(.r) .th-btn{justify-content:flex-start}
.th-btn:hover{background:var(--hover)}
.dtable td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
.dtable td.r{text-align:right;font-variant-numeric:tabular-nums}
.dtable tr:last-child td{border-bottom:0}
.dtable th:first-child,.dtable td:first-child{position:sticky;left:0;z-index:1;background:var(--panel);box-shadow:1px 0 0 var(--line)}
.dtable th:first-child{z-index:2;background:var(--subtle)}
.dtable tr.clickable{cursor:pointer}
.dtable tr.clickable:hover td{background:var(--hover)}
.dtable td.t0{background:var(--miss-soft)}
.dtable td.t1{background:color-mix(in srgb,var(--done) 12%,var(--panel))}
.dtable td.t2{background:color-mix(in srgb,var(--done) 28%,var(--panel))}
.dtable td.t3{background:color-mix(in srgb,var(--done) 50%,var(--panel))}
.dtable td.t4{background:var(--done);color:#fff}
.cell-h{display:flex;align-items:center;gap:7px;background:transparent;color:var(--ink);padding:0;font-weight:500;max-width:220px}
.cell-h:hover{background:transparent;text-decoration:underline}
.cell-h span{overflow:hidden;text-overflow:ellipsis}
.table-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:.86rem}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) repeat(var(--n),56px);gap:4px;align-items:stretch}
.dg-h{font-size:.74rem;color:var(--muted);text-align:center;font-weight:600;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;line-height:1.2;padding:2px 0 4px}
.dg-h b{font-size:.95rem;color:var(--ink)}
.dg-h.today b{color:var(--accent)}
.dg-name{display:flex;align-items:center;gap:8px;justify-content:flex-start;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:8px 10px;border-radius:10px;min-width:0;font-weight:600;text-align:left}
.dg-name:hover{background:var(--hover)}
.dg-name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--c)}
.dg-ring{width:22px;height:22px;flex-shrink:0;color:var(--c);display:grid}
.dg-ring svg{width:22px;height:22px}
.dg-cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0;min-height:48px;color:var(--faint)}
.dg-cell:hover{background:var(--hover)}
.dg-cell .ic{width:20px;height:20px}
.dg-cell.on{color:var(--c)}
.dg-cell.on .ic{stroke-width:2.8}
.dg-cell.soft{color:color-mix(in srgb,var(--c) 45%,var(--panel))}
.dg-cell.slip{color:var(--danger)}
.dg-cell.part{color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.dg-cell.off .ic{width:8px;height:8px}
.dg-cell.out{background:transparent;border-color:transparent}
.dg-cell .qty{font-weight:700;font-size:.9rem}
.dg-cell.on .qty{color:var(--c)}
.hm.big{--hm:24px}
.hm.big .hm-grid b{font-size:.62rem;font-weight:600;display:grid;place-items:center;color:var(--muted);border-radius:4px}
.hm.big .hm-grid b.hd,.hm.big .hm-grid b.l4,.hm.big .hm-grid b.l3{color:#fff}
.hm.big .hm-grid b.fut{color:transparent}
.hm.big .hm-days{font-size:.7rem}
.day-mode{margin-left:4px}
.hm.edit .hm-grid b:not(.x):not(.fut){cursor:pointer;outline:1px dashed var(--line-strong);outline-offset:-1px}
.edit-note{margin:-4px 0 10px}
.dg-cell.before{border-style:dashed}
.hname-btn{background:transparent;color:var(--ink);padding:0;font-weight:600;text-align:left;justify-content:flex-start;min-width:0}
.hname-btn:hover{background:transparent;text-decoration:underline}
.sync-status{margin:0 0 12px;color:var(--muted);font-size:.92rem}
.sync-status.bad{color:var(--danger)}
.sync-help{margin-top:14px}
.sync-help summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.9rem}
.sync-help ol{margin:8px 0 0;padding-left:20px;color:var(--ink-2);font-size:.9rem;line-height:1.55}
.sync-error [data-v=settings],.sync-error [data-v=more]{position:relative}
.sync-error [data-v=settings]::after,.sync-error [data-v=more]::after{content:'';position:absolute;top:8px;right:10px;width:8px;height:8px;border-radius:50%;background:#ef5f5a}
@media(max-width:760px){
  .summary{grid-template-columns:auto repeat(2,minmax(0,1fr))}
  .summary .sring{grid-row:span 2}
  .hb{grid-template-columns:minmax(0,1fr) 72px;gap:4px 10px}
  .hb .hb-track{grid-column:1/-1;grid-row:2}
  .hb-name{grid-row:1}
  .filters select.field{flex:1 1 140px;max-width:none}
  .dgrid{grid-template-columns:minmax(0,1fr) repeat(var(--n),44px);gap:3px}
  .dg-name{padding:8px 6px;font-size:.92rem;gap:6px}
  .dg-cell{min-height:46px;border-radius:8px}
  .hm.big{--hm:22px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .tab{flex-shrink:0}
  .rel-list li{grid-template-columns:60px minmax(0,1fr)}
  .srow{gap:6px}
  .sd{font-size:.74rem}
  .day-mode{margin-left:0}
}

/* Avisos */
.toast-wrap{position:fixed;right:20px;bottom:20px;z-index:300}
.toast{background:var(--nav);color:#fff;padding:10px 8px 10px 14px;border-radius:10px;display:flex;gap:10px;align-items:center;box-shadow:0 12px 32px rgba(10,16,30,.3);max-width:min(560px,calc(100vw - 40px));animation:toast-in .2s ease-out}
.toast>.ic{color:#9fb4ff}
.toast span{flex:1}
.toast button{background:transparent;color:#a9bcff;padding:5px 8px;font-size:.9rem}
.toast button:hover{background:rgba(255,255,255,.08)}
.toast .toast-x{color:#9aa4ba;width:28px;height:28px;padding:0}
@keyframes toast-in{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Móvil */
.bottom-nav{display:none}
@media(max-width:760px){
  body{font-size:15px}
  main{padding:0 14px calc(96px + env(safe-area-inset-bottom))}
  .page-head{padding:14px 0 10px;margin-bottom:12px}
  .head-row{align-items:flex-start;gap:10px}
  .head-title{min-width:0;flex-basis:100%}
  .head-actions{width:100%}
  .head-actions select.field{flex:1 1 140px}
  .seg.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-strong)}
  .seg.grid2 button{border:0!important}
  .date-nav{width:100%}
  .date-nav input.field{flex:1}
  .hrow{padding:8px 8px 8px 10px;gap:10px}
  .hcard{grid-template-columns:auto minmax(0,1fr)}
  .hcard .tools{grid-column:1/-1;justify-content:flex-start;border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
  .stats-line{grid-column:1/-1}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .toolbar select.field{max-width:none;flex:1}
  dialog{width:100%;max-width:none;margin:auto 0 0;border-radius:16px 16px 0 0;max-height:92vh;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:200;background:var(--nav);padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(10,16,30,.18)}
  .bottom-nav button{flex-direction:column;gap:2px;background:transparent;color:var(--nav-muted);font-size:.7rem;font-weight:600;padding:6px 2px;border-radius:10px}
  .bottom-nav button .ic{width:22px;height:22px}
  .bottom-nav button.active{color:#fff}
  .bottom-nav .bn-fab{background:var(--done);color:#fff;width:52px;height:52px;border-radius:16px;justify-self:center;margin-top:-18px;box-shadow:0 8px 20px rgba(28,122,79,.4)}
  .bottom-nav .bn-fab .ic{width:26px;height:26px}
  .toast-wrap{left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom))}
  .toast{max-width:none}
  .pc-only{display:none!important}
}
@media(min-width:761px){
  .mobile-only{display:none!important}
  .hm{--hm:14px}
  .head-actions select.field{width:auto;max-width:260px}
}

/* ================= Diseño: cuaderno de puntos («cada día es una casilla») ================= */
body{background:var(--paper) radial-gradient(var(--dot) 1px,transparent 1.3px) 0 0/22px 22px;color:var(--ink)}
.app-layout{display:block;min-height:100vh}
main{max-width:980px;padding:0 28px 72px}
/* Botones: píldoras de tinta */
button{border-radius:999px;background:var(--ink);color:var(--paper);font-weight:650}
button:hover{background:var(--accent-ink);color:var(--paper)}
:root[data-theme=dark] button:hover{background:var(--accent);color:var(--paper)}
button.secondary{background:transparent;color:var(--ink);border:1.5px solid var(--line-strong)}
button.secondary:hover{background:var(--hover);border-color:var(--ink-2);color:var(--ink)}
button.ghost{background:transparent;color:var(--muted)}
button.ghost:hover{background:var(--hover);color:var(--ink)}
button.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger-line)}
button.danger:hover{background:var(--danger-soft);color:var(--danger)}
button.icon{border-radius:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input.field,select.field,textarea.field{border:1.5px solid var(--line-strong);border-radius:10px;background:var(--field)}
input.field:focus,select.field:focus,textarea.field:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--mark-soft)}
.seg{border:1.5px solid var(--line-strong);border-radius:999px;background:var(--panel);padding:2px;gap:2px}
.seg button{border-radius:999px!important;background:transparent;color:var(--muted);padding:6px 12px;border:0!important}
.seg button:hover{background:var(--hover);color:var(--ink)}
.seg button.active,.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.chip{border-radius:6px;background:var(--chip);color:var(--chip-ink)}
.chip.warn{background:var(--mark-soft);color:var(--warn-ink)}
.cue{font-style:italic;color:var(--muted)}
/* Barra superior (PC) */
.topbar{position:sticky;top:0;z-index:150;background:var(--head-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1.5px dotted var(--line-strong)}
.topbar-in{max-width:1120px;margin:0 auto;padding:0 28px;height:var(--topbar-h);display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:9px;padding:0;color:var(--ink);font-weight:800;letter-spacing:-.02em;font-size:1.06rem;white-space:nowrap}
.brand .mark{width:28px;height:28px;border-radius:8px;background:var(--done);color:#fff;display:grid;place-items:center}
.topnav{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.topnav .nav-item{width:auto;background:transparent;color:var(--muted);padding:8px 9px;border-radius:10px;font-weight:600;gap:7px;box-shadow:none}
.topnav .nav-item:hover{background:var(--hover);color:var(--ink)}
.topnav .nav-item.active{color:var(--ink);background:transparent;box-shadow:none}
.topnav .nav-item.active .nav-label{background:linear-gradient(transparent 55%,var(--mark) 55%,var(--mark) 90%,transparent 90%);padding:0 2px}
.topnav .nav-item .ic{width:17px;height:17px}
.topnav .nav-count{background:var(--chip);color:var(--muted);margin-left:2px}
.topnav .nav-count.complete{background:var(--done-soft);color:var(--done)}
.topbar .install{flex-shrink:0}
/* Cabeceras */
.page-head{top:var(--topbar-h);background:var(--head-bg);border-bottom:1.5px dotted var(--line-strong);padding:20px 0 14px}
.page-title{font-weight:800;letter-spacing:-.035em}
.card h2,.tod-title{font-weight:750;letter-spacing:-.01em}
/* Hoy: hoja de calendario de taco */
.today-top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.tearoff{display:flex;align-items:center;gap:14px}
.tear-num{font-size:clamp(58px,8vw,86px);font-weight:800;line-height:.82;letter-spacing:-.06em;font-variant-numeric:tabular-nums;padding:0 4px 2px}
.tearoff.is-today .tear-num{background:linear-gradient(transparent 52%,var(--mark) 52%,var(--mark) 94%,transparent 94%)}
.tear-txt .big-title{font-size:1.5rem;letter-spacing:-.025em;font-weight:800;line-height:1.1}
.tear-txt .sub-date{font-size:.98rem;margin-top:2px}
.date-nav{gap:4px}
.date-nav input.field{width:auto;padding:6px 8px;font-size:.9rem}
.week-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:16px}

/* ================= Constantes ================= */

/* Plantillas para crear hábitos (ideas habituales en apps de hábitos y desarrollo personal) */
const TEMPLATES=[

/* ================= Utilidades ================= */
const $=id=>document.getElementById(id);
const clone=o=>JSON.parse(JSON.stringify(o));
const pl=(n,s,p)=>`${n} ${n===1?s:p}`;
const validIso=v=>typeof v==='string'&&v!==''&&!isNaN(Date.parse(v));
const isoOr=(v,d)=>validIso(v)?new Date(v).toISOString():d;
const nowIso=()=>new Date().toISOString();
const stripEmoji=s=>String(s).replace(/^[\p{Extended_Pictographic}←-⇿⬀-⯿️‍\s]+/u,'');
const SVGNS='http://www.w3.org/2000/svg';
function ic(name,cls=''){ const s=document.createElementNS(SVGNS,'svg'); s.setAttribute('class','ic '+cls); s.setAttribute('aria-hidden','true'); const u=document.createElementNS(SVGNS,'use'); u.setAttribute('href','#i-'+name); s.append(u); return s; }
function el(tag,cls,text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function opt(v,t,sel){ const o=document.createElement('option'); o.value=v; o.textContent=t; if(sel) o.selected=true; return o; }
function btn(text,cls,label,fn,icon){
  const b=el('button',cls); b.type='button';
  if(icon) b.append(ic(icon,'sm'));
  if(text) b.append(document.createTextNode(text));
  if(label){ b.title=label; b.setAttribute('aria-label',label); }
  if(fn) b.addEventListener('click',fn);
  return b;
}
function field(tag,attrs={}){ const e=document.createElement(tag); e.className='field'; for(const [k,v] of Object.entries(attrs)){ if(v==null) continue; if(k in e&&k!=='list') e[k]=v; else e.setAttribute(k,v); } return e; }
function fld(label,control,cls){ const w=el('div','fld'+(cls?' '+cls:'')); const id=control.id||('f'+Math.random().toString(36).slice(2,8)); control.id=id; const l=el('label',null,label); l.htmlFor=id; w.append(l,control); return w; }
function newId(){
  try{ if(window.crypto&&typeof crypto.randomUUID==='function') return crypto.randomUUID(); }catch(e){}
  const b=crypto.getRandomValues(new Uint8Array(16)); b[6]=(b[6]&15)|64; b[8]=(b[8]&63)|128;
  const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}
/* Números: se muestran en español y se aceptan «,» y «.» al escribir */
const NF=new Intl.NumberFormat('es-ES',{maximumFractionDigits:2});
const NFP=new Intl.NumberFormat('es-ES',{style:'percent',minimumFractionDigits:1,maximumFractionDigits:1});
const fmtNum=n=>NF.format(n);
const fmtPct=x=>x==null?'—':NFP.format(x);
function parseNum(v){
  if(typeof v==='number') return Number.isFinite(v)?v:NaN;
  let s=String(v==null?'':v).trim().replace(/\s/g,'');
  if(!s) return NaN;
  if(s.includes(',')&&s.includes('.')) s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(',','.');
  return /^-?\d+(\.\d+)?$/.test(s)?Number(s):NaN;
}

/* ---- Fechas: siempre locales. Nunca new Date('YYYY-MM-DD') ni restar milisegundos ---- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function parseYMD(s){
  if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
  const [y,m,d]=s.split('-').map(Number); const dt=new Date(y,m-1,d);
  return (dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===d)?dt:null;
}
const validYMD=s=>!!parseYMD(s);
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const addDaysS=(s,n)=>ymd(addDays(parseYMD(s),n));
const dowOf=s=>parseYMD(s).getDay();
/* Número de día de calendario (cuenta de días civiles, no depende del huso ni del cambio de hora) */
const dayNum=s=>{ const [y,m,d]=s.split('-').map(Number); return Math.round(Date.UTC(y,m-1,d)/864e5); };
const daysBetween=(a,b)=>dayNum(b)-dayNum(a);
/* «Hoy» se puede fijar en las pruebas */
let todayOverride=null;
const today=()=>todayOverride||ymd(new Date());
const weekStartDay=()=>state&&state.settings?state.settings.weekStart:1;
function weekStartOf(s,ws=weekStartDay()){ const d=parseYMD(s); return ymd(addDays(d,-((d.getDay()-ws+7)%7))); }
const monthStart=s=>s.slice(0,8)+'01';
const DTF={
  long:new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long'}),
  longY:new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),
  short:new Intl.DateTimeFormat('es-ES',{day:'numeric',month:'short'}),
  shortY:new Intl.DateTimeFormat('es-ES',{day:'numeric',month:'short',year:'numeric'})
};
function fmtDate(s,long=false){
  const d=parseYMD(s); if(!d) return '';
  const sameYear=s.slice(0,4)===today().slice(0,4);
  return (long?(sameYear?DTF.long:DTF.longY):(sameYear?DTF.short:DTF.shortY)).format(d);
}
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
function fmtRange(a,b){ return a===b?fmtDate(a):`${fmtDate(a)} – ${fmtDate(b)}`; }

/* ================= Estado ================= */
let state=null, ready=false, rev=0;
const undoStack=[];
function defaultState(){
  const t=nowIso();
  return {version:1,habits:[],logs:[],skips:[],
    categories:DEFAULT_CATS.map((name,i)=>({id:'cat'+(i+1),name,order:i,updatedAt:EPOCH})),

async function pipeBytes(u8,stream){
  const w=stream.writable.getWriter(); w.write(u8).catch(()=>{}); w.close().catch(()=>{});
  return new Uint8Array(await new Response(stream.readable).arrayBuffer());
}
async function encryptState(st,saltB64){
  const payload=Object.assign({app:'habitos',v:1,savedAt:nowIso()},syncPart(st));
  let bytes=te.encode(JSON.stringify(payload)), z=0;
  if(typeof CompressionStream==='function'){ try{ bytes=await pipeBytes(bytes,new CompressionStream('gzip')); z=1; }catch(e){ bytes=te.encode(JSON.stringify(payload)); z=0; } }
  const salt=saltB64?b64d(saltB64):crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(syncCfg.pass,salt,PBKDF2_ITER);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:te.encode(AAD)},key,bytes));
  return JSON.stringify({app:'habitos',v:1,kdf:'PBKDF2-SHA256',iter:PBKDF2_ITER,salt:b64e(salt),iv:b64e(iv),z,data:b64e(ct)});
}
async function decryptEnv(text){
  const bad=()=>syncErr('format','Los datos guardados en GitHub no tienen el formato esperado.');
  let env; try{ env=JSON.parse(text); }catch(e){ throw bad(); }
  if(!env||env.app!=='habitos'||!env.data||!env.salt||!env.iv) throw bad();
  if(env.v!==1) throw syncErr('version','Los datos de GitHub los guardó una versión más nueva de la app. Cierra la app y ábrela de nuevo para actualizarla.');
  const key=await deriveKey(syncCfg.pass,b64d(env.salt),env.iter||PBKDF2_ITER);
  let plain;
  try{ plain=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(env.iv),additionalData:te.encode(AAD)},key,b64d(env.data))); }
  catch(e){ throw syncErr('password','La contraseña de cifrado no coincide con la de los datos guardados en GitHub.'); }
  if(env.z){
    if(typeof DecompressionStream!=='function') throw syncErr('version','Este navegador no puede leer los datos comprimidos de GitHub. Actualiza Chrome.');
    plain=await pipeBytes(plain,new DecompressionStream('gzip'));
  }
  let obj; try{ obj=JSON.parse(td.decode(plain)); }catch(e){ throw bad(); }
  const st=normalizeState({habits:obj.habits,logs:obj.logs,skips:obj.skips,moods:obj.moods,categories:obj.categories,tags:obj.tags,habitica:obj.habitica,deleted:obj.deleted});
  if(!st) throw bad();
  return {st,salt:env.salt};
}

/* ---- API de GitHub (Gists) ---- */
async function gh(path,opts={}){
  let res;
  try{
    res=await fetch('https://api.github.com'+path,{method:opts.method||'GET',cache:'no-store',
      headers:Object.assign({Accept:'application/vnd.github+json',Authorization:'Bearer '+syncCfg.token},opts.body?{'Content-Type':'application/json'}:{}),
      body:opts.body?JSON.stringify(opts.body):undefined});
  }catch(e){ throw syncErr('network','No se ha podido conectar con GitHub.'); }
  if(res.ok) return res;
  if(res.status===401) throw syncErr('token','El token de GitHub no es válido o ha caducado.');
  if(res.status===403||res.status===429){
    if(res.status===429||res.headers.get('x-ratelimit-remaining')==='0') throw syncErr('limit','GitHub ha limitado las peticiones por un rato. Se reintentará solo.');
    throw syncErr('perm','El token no tiene permiso para los Gists. Créalo de nuevo con «Gists: Read and write».');
  }
  if(res.status===404) throw syncErr('notfound','No se encuentra el Gist de sincronización.');
  throw syncErr('http','GitHub ha respondido con un error ('+res.status+').');
}
/* Busca el Gist de la app; si hay varios, el más antiguo (así todos los dispositivos eligen el mismo) */
async function findGist(){
  let best=null;
  for(let page=1;page<=10;page++){
    const list=await (await gh(`/gists?per_page=100&page=${page}`)).json();
    list.forEach(g=>{ if(g.files&&g.files[SYNC_FILE]&&(!best||tsOf(g.created_at)<tsOf(best.created_at))) best=g; });
    if(list.length<100) break;
  }
  return best?best.id:'';
}
async function readGist(id){
  const g=await (await gh('/gists/'+encodeURIComponent(id))).json(), f=g.files&&g.files[SYNC_FILE];
  if(!f) return null;
  if(f.truncated||typeof f.content!=='string'){
    let r; try{ r=await fetch(f.raw_url,{cache:'no-store'}); }catch(e){ throw syncErr('network','No se ha podido conectar con GitHub.'); }
    if(!r.ok) throw syncErr('http','GitHub ha respondido con un error ('+r.status+').');
    return r.text();
  }
  return f.content;
}
async function writeGist(id,content){
  if(id){ await gh('/gists/'+encodeURIComponent(id),{method:'PATCH',body:{files:{[SYNC_FILE]:{content}}}}); return id; }
  const g=await (await gh('/gists',{method:'POST',body:{description:SYNC_DESC,public:false,files:{[SYNC_FILE]:{content}}}})).json();
  return g.id;
}

/* ---- Ajustes de sincronización de este dispositivo (solo en su localStorage, nunca en las copias) ---- */
function loadSyncCfg(){
  try{
    const c=JSON.parse(localStorage.getItem(SYNC_KEY));
    if(c&&typeof c==='object'&&c.token&&c.pass) return {token:String(c.token),pass:String(c.pass),gistId:String(c.gistId||''),lastSync:validIso(c.lastSync)?c.lastSync:'',synced:!!c.synced};
  }catch(e){}
  return null;
}
let syncCfg=loadSyncCfg();
function saveSyncCfg(){ try{ if(syncCfg) localStorage.setItem(SYNC_KEY,JSON.stringify(syncCfg)); else localStorage.removeItem(SYNC_KEY); }catch(e){} }
const syncRt={busy:false,pending:false,timer:null,status:syncCfg?'ok':'off',err:null,halt:'',toastKind:''};
let renderPending=false;
function applyMerged(st){
  st.settings=state.settings;
  state=st; undoStack.length=0; touch(); flush();
  if($('dlg').open) renderPending=true; else renderApp();
}
async function syncCycle(){
  if(!syncCfg.gistId){ syncCfg.gistId=await findGist(); saveSyncCfg(); }
  let remote=null, salt='';
  if(syncCfg.gistId){
    let text;
    try{ text=await readGist(syncCfg.gistId); }
    catch(e){ if(e.kind==='notfound'){ syncCfg.gistId=''; saveSyncCfg(); text=null; } else throw e; }
    if(text){ const r=await decryptEnv(text); remote=r.st; salt=r.salt; }
  }
  /* Desde aquí hasta aplicar la fusión no hay esperas: se usa el estado de este mismo instante */
  const local=state, localFp=fingerprint(local), remoteFp=remote?fingerprint(remote):'';
  let merged=local;
  if(remote){ merged=(!syncCfg.synced&&isPristine(local))?normalizeState(Object.assign(clone(remote),{settings:local.settings})):mergeStates(local,remote); merged.settings=local.settings; }
  const mergedFp=fingerprint(merged);
  if(merged!==local&&mergedFp!==localFp) applyMerged(merged);
  if(!remote||mergedFp!==remoteFp){
    const content=await encryptState(merged,salt);
    syncCfg.gistId=await writeGist(syncCfg.gistId,content);
  }
  syncCfg.synced=true;
}
async function syncNow(opts={}){
  if(!syncCfg) return {ok:false};
  if(syncRt.busy){ syncRt.pending=true; return {ok:false,busy:true}; }
  if(syncRt.halt&&!opts.force) return {ok:false};
  if(pendingSave()) await flush();
  syncRt.busy=true; syncRt.halt=''; setSyncStatus('syncing');
  let res={ok:true};
  try{
    const run=()=>syncCycle();
    if(navigator.locks&&navigator.locks.request) await navigator.locks.request('habitos_sync',run); else await run();
    syncCfg.lastSync=nowIso(); saveSyncCfg(); syncRt.err=null; syncRt.toastKind='';
    setSyncStatus('ok');
  }catch(e){ res={ok:false,err:e}; handleSyncError(e,opts.quiet); }
  finally{ syncRt.busy=false; const bx=document.getElementById('syncBox'); if(bx) fillSyncBox(bx); if(syncRt.pending){ syncRt.pending=false; if(!syncRt.halt) scheduleSync(2000); } }
  return res;
}
function scheduleSync(delay=5000){
  if(!syncCfg||syncRt.halt) return;
  clearTimeout(syncRt.timer); syncRt.timer=setTimeout(()=>syncNow(),delay);
}
function handleSyncError(e,quiet){
  const known=e&&e.kind, kind=known||'unknown', msg=known?e.message:'Ha ocurrido un error inesperado al sincronizar.';
  if(!known) console.error(e);
  syncRt.err={kind,msg};
  if(['token','password','perm','version','format'].includes(kind)) syncRt.halt=kind;
  setSyncStatus('error');
  if(!quiet&&kind!=='network'&&kind!=='limit'&&syncRt.toastKind!==kind){
    syncRt.toastKind=kind;
    showToast('⚠️ '+msg+(syncRt.halt?' La sincronización está en pausa.':''),{action:'Abrir ajustes',fn:()=>go('settings'),timeout:20000});
  }
}
function setSyncStatus(s){
  syncRt.status=s;
  document.documentElement.classList.toggle('sync-error',s==='error'&&!!syncRt.halt);
  const box=document.getElementById('syncBox'); if(box) fillSyncBox(box);
  else if(ready&&ui.view==='settings'&&!$('dlg').open) renderApp();
}
function syncStatusText(){
  if(!syncCfg) return 'Desactivada en este dispositivo.';
  if(syncRt.status==='syncing') return 'Sincronizando…';
  if(syncRt.status==='error'&&syncRt.err) return syncRt.err.msg+(syncRt.halt?' Sincronización en pausa: corrígelo y pulsa «Sincronizar ahora».':' Se reintentará.');
  const d=syncCfg.lastSync?new Date(syncCfg.lastSync):null;
  return 'Activa.'+(d?` Última vez: ${ymd(d)===today()?'hoy':fmtDate(ymd(d))}, a las ${pad(d.getHours())}:${pad(d.getMinutes())}.`:'');
}
async function activateSync(token,p1,p2){
  const prev=syncCfg; token=(token||'').trim()||(prev?prev.token:'');
  if(!token) return 'Pega el token de GitHub (empieza por github_pat_).';
  if(!prev||p1||p2){
    if((p1||'').length<8) return 'La contraseña de cifrado debe tener al menos 8 caracteres.';
    if(p1!==p2) return 'Las dos contraseñas no coinciden.';
  }
  const pass=(p1||(prev?prev.pass:'')).normalize('NFC');
  const sameAccount=prev&&prev.token===token;
  syncCfg={token,pass,gistId:sameAccount?prev.gistId:'',lastSync:'',synced:sameAccount?prev.synced:false};
  keyCache.id=''; syncRt.halt='';
  let r=await syncNow({force:true,quiet:true});
  if(!r.ok&&r.err&&r.err.kind==='password'&&syncCfg.gistId&&
     confirm('La contraseña no coincide con la de los datos que ya hay en GitHub.\n\nSi es la primera vez o te equivocaste al crearla, puedes SOBRESCRIBIR esa copia con los datos de ESTE dispositivo (se perderá lo que solo estuviera en esa copia). ¿Sobrescribir?')){
    try{ syncCfg.synced=true; syncCfg.lastSync=nowIso(); await writeGist(syncCfg.gistId,await encryptState(state,'')); saveSyncCfg(); syncRt.err=null; syncRt.halt=''; setSyncStatus('ok'); r={ok:true}; }
    catch(e){ r={ok:false,err:e}; }
  }
  if(r.ok){ saveSyncCfg(); showToast('✅ Sincronización activada',{timeout:4000}); startSyncTimer(); return ''; }
  syncCfg=prev; saveSyncCfg(); syncRt.err=null; syncRt.halt=''; setSyncStatus(prev?'ok':'off');
  const e=r.err; return (e&&e.kind?e.message:'No se ha podido activar la sincronización.')+(e&&e.kind==='token'?' Revisa que has copiado el token entero.':'');
}
function disableSync(){
  if(!confirm('Se borrarán el token y la contraseña de este dispositivo y dejará de sincronizar.\n\nTus hábitos en este dispositivo y la copia cifrada en GitHub no se tocan. ¿Continuar?')) return;
  clearTimeout(syncRt.timer); syncCfg=null; saveSyncCfg(); syncRt.err=null; syncRt.halt=''; keyCache.id=''; setSyncStatus('off'); renderApp();
}
/* Sincroniza al abrir, al volver a la app, al recuperar la conexión y cada 3 minutos con la app a la vista */
let syncTimer=null;
function startSyncTimer(){ clearInterval(syncTimer); if(syncCfg) syncTimer=setInterval(()=>{ if(document.visibilityState==='visible') syncNow({quiet:true}); },180000); }
window.addEventListener('online',()=>{ if(syncCfg) syncNow({quiet:true}); });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&syncCfg&&ready) scheduleSync(800); });
$('dlg').addEventListener('close',()=>{ if(renderPending){ renderPending=false; renderApp(); } });

/* ---- Sección de Ajustes ---- */
function fillSyncBox(box){
  const st=box.querySelector('.sync-status'); st.textContent=syncStatusText(); st.classList.toggle('bad',syncRt.status==='error');
  const on=!!syncCfg;
  box.querySelector('[data-k=act]').textContent=on?'Guardar cambios':'Activar sincronización';
  box.querySelector('[data-k=now]').hidden=!on; box.querySelector('[data-k=off]').hidden=!on;
  box.querySelector('[data-k=now]').disabled=syncRt.busy; box.querySelector('[data-k=act]').disabled=syncRt.busy;
  box.querySelector('[data-k=tok]').placeholder=on?'(guardado; escribe uno nuevo para cambiarlo)':'github_pat_…';
  box.querySelector('[data-k=p1]').placeholder=on?'(guardada; escribe otra para cambiarla)':'';
}

   Se cuenta lo que se va marcando de la lista durante el ciclo, que se cierra el día que toca. */
function habCycleSchedule(t){
  if(!t||t.type!=='daily') return null;
  const cl=Array.isArray(t.checklist)?t.checklist.length:0; if(cl<2) return null;
  const conv=habSchedule(t); if(conv.grey) return null; const b=conv.schedule;
  const one=(b.type==='weekdays'&&b.days.length===1)||(b.type==='monthDays'&&b.days.length===1)||(b.type==='nthWeekday'&&b.weeks.length===1&&b.days.length===1)||b.type==='yearly'||(b.type==='everyN'&&b.n>=2);

}
/* Habitica no guarda cuándo se marca cada elemento de una lista: se anota el día en que la app lo ve marcado

function habCycleSync(t,h,m,stamp){

  const marks=new Map(); let detailFrom=t0;
  const addMark=c=>{
    if(c>t0||c<h.startDate) return; const e=ent(c); if(!isCycle(e.schedule)) return;
    const be={from:e.from,schedule:e.schedule.base}; let day=c;
    if(!dueFixed(be,c)) for(let k=1;k<=3;k++){ const x=addDaysS(c,-k); if(x<h.startDate) break; if(dueFixed(be,x)){ if(!marks.has(periodOf(e,x)[1])) day=x; break; } }

    if(day<a) day=a; if(day>od) day=od;

      if(!it||!it.id) continue; const k=`${id}|${it.id}|${b}`, rec=state.habitica.checks[k];
      if(it.completed&&!rec){ state.habitica.checks[k]=[day,stamp]; delete state.deleted['hchk:'+k]; ch++; }

  for(const k of Object.keys(state.habitica.done)) if(k.startsWith(pre)){ const b=k.slice(pre.length); if(b>=detailFrom&&!marks.has(b)){ delete state.habitica.done[k]; state.deleted['hdone:'+k]=stamp; ch++; } }
  for(const [b,day] of marks){ const k=pre+b, v=state.habitica.done[k]; if(!v||v[0]!==day){ state.habitica.done[k]=[day,stamp]; delete state.deleted['hdone:'+k]; ch++; } }

  for(const [k,v] of Object.entries(state.habitica.done)) if(k.startsWith(pre)&&!withChecks.has(k.slice(pre.length))&&!cnt.has(v[0])) cnt.set(v[0],1);
  for(const [d,n] of cnt) if(d<=t0&&d>=h.startDate) ch+=habSetDay(h,d,n,stamp);

}
function reconcile(dailys,habits,stamp){
  const byId=new Map(dailys.concat(habits).map(t=>[t.id||t._id,t]));
  const t0=today(); let changed=0, other=0;
  for(const m of habLinks()){
    const t=byId.get(m.habiticaId), h=state.habits.find(x=>x.id===m.habitId);
    if(m.missing!==!t){ m.missing=!t; m.updatedAt=stamp; }

    const arch=t.type==='daily'&&!!habSchedule(t).grey;
    if(h.archived!==arch){ h.archived=arch; h.updatedAt=stamp; other++; }
    const tg=(Array.isArray(t.tags)?t.tags:[]).map(x=>'hab-'+x).filter(x=>state.tags.some(g=>g.id===x)).sort();
    if(JSON.stringify(tg)!==JSON.stringify(h.tags.slice().sort())){ h.tags=tg; h.updatedAt=stamp; other++; }

    if(m.priority!==pr||m.value!==val||m.streak!==stk){ m.priority=[0.1,1,1.5,2].includes(pr)?pr:null; m.value=val; m.streak=stk; }

    /* El nombre lo manda Habitica (si no lo has cambiado aquí) */
    { const want=habLocalName(t.text,m.kind,both);
      if(t.text&&h.name!==want){ h.name=want; h.updatedAt=stamp; other++; }
      if(t.text&&t.text!==m.name){ m.name=t.text; m.updatedAt=stamp; } }
    if(m.kind==='daily'){
      const cyc=habCycleSchedule(t), want=cyc||habSchedule(t).schedule, wantKind=cyc?'count':'check';
      if(h.kind!==wantKind){

        h.kind=wantKind; h.target=cyc?{amount:1,unit:'de la lista'}:null; h.scheduleHistory=[{from:h.startDate,schedule:want}]; h.schedule=want; fixHistory(h,want); h.updatedAt=stamp; other++;

      } else if(!sameSchedule(want,h.schedule)){ const from=h.startDate>t0?h.startDate:t0; h.scheduleHistory=h.scheduleHistory.filter(e=>e.from<from); h.scheduleHistory.push({from,schedule:want}); h.schedule=want; fixHistory(h,want); h.updatedAt=stamp; other++; }

    } else {
      for(const [d,c] of habHabitDays(t).days) if(d<=t0) changed+=habSetDay(h,d,habDayValue(h,m.kind,c),stamp);
    }
  }

}

async function habSync(opts={}){
  if(!habCfg||!ready) return {ok:false};
  if(habRt.busy){ habRt.again=true; return {ok:false,busy:true}; }
  if(habRt.retryAt&&Date.now()<habRt.retryAt&&!opts.force) return {ok:false};
  habRt.busy=true; setHabStatus('syncing'); habRt.pace=opts.auto?2500:0;
  const stamp=nowIso(); let res={ok:true};
  try{
    const user=await hab('/user?userFields=profile.name,stats,lastCron,history.exp,party._id,party.quest,items.currentPet,items.currentMount,items.eggs,items.hatchingPotions,items.food,items.pets,items.mounts,items.gear,preferences.dayStart,preferences.timezoneOffset,preferences.costume,tags');
    habRt.user=user; buildCrons(user);
    const dailys=await hab('/tasks/user?type=dailys'), habits=await hab('/tasks/user?type=habits');
    habRt.tasks={dailys,habits};
    try{ habRt.todos=await hab('/tasks/user?type=todos'); }catch(e){ if(e.kind==='token'||e.kind==='limit') throw e; }
    let party=null; if(user.party&&user.party._id){ try{ party=await hab('/groups/party'); }catch(e){ if(e.kind==='token'||e.kind==='limit') throw e; } }
    habRt.party=party;
    /* Batalla: el chat del grupo guarda cada golpe al cerrar el día; los compañeros, cada 15 minutos */
    if(party&&party.quest&&party.quest.key&&party.quest.active){
      try{ habRt.chat=await hab('/groups/party/chat?limit=200'); }catch(e){ if(e.kind==='token'||e.kind==='limit') throw e; }
    } else habRt.chat=null;
    if(party&&(opts.force||!habRt.membersAt||Date.now()-habRt.membersAt>30*60e3)){
      try{ habRt.members=await hab('/groups/party/members?includeAllPublicFields=true'); habRt.membersAt=Date.now(); }catch(e){ if(e.kind==='token'||e.kind==='limit') throw e; }
    }
    if(!party){ habRt.members=null; habRt.membersAt=0; }
    await habLoadNames();
    /* Todo lo de Habitica se importa solo; las etiquetas y la experiencia diaria también */
    const tg=habSyncTags(user.tags,stamp), xp=habStoreXp(user);
    let made=0; for(const t of dailys.concat(habits)) made+=habImport(t).made.length;
    const r=reconcile(dailys,habits,stamp);
    habApply(r.changed+r.other+made+tg>0||xp>0);
    if(made&&!opts.quiet) showToast(`Importados de Habitica: ${pl(made,'hábito','hábitos')}`);
    habCfg.lastPull=stamp; habCfg.snap=habSnap(); saveHabCfg();
    habRt.err=null; habRt.last={at:stamp,changed:r.changed};
    res={ok:true,changed:r.changed,made};
  }catch(e){
    res={ok:false,err:e}; habRt.err={kind:e.kind||'unknown',msg:e.kind?e.message:'Error inesperado al hablar con Habitica.'}; if(!e.kind) console.error(e);
    if(!opts.quiet&&e.kind==='token') showToast('⚠️ '+habRt.err.msg,{action:'Abrir Habitica',fn:()=>go('habitica'),timeout:15000});

    habRt.busy=false; setHabStatus(res.ok?'ok':'error');
    if(habRt.again){ habRt.again=false; scheduleHabSync(2000); }
  }
  return res;
}
/* Etiquetas de Habitica como etiquetas locales («hab-<id>») */
function habSyncTags(tags,stamp){
  const want=new Map((Array.isArray(tags)?tags:[]).filter(g=>g&&g.id&&g.name).map(g=>['hab-'+g.id,mdPlain(g.name).slice(0,40)]));
  let ch=0;
  for(const [id,name] of want){ const x=state.tags.find(q=>q.id===id); if(!x){ state.tags.push({id,name,updatedAt:stamp}); delete state.deleted['tag:'+id]; ch++; } else if(x.name!==name){ x.name=name; x.updatedAt=stamp; ch++; } }
  for(const x of state.tags.slice()) if(x.id.startsWith('hab-')&&!want.has(x.id)){ state.tags=state.tags.filter(q=>q!==x); state.deleted['tag:'+x.id]=stamp; for(const h of state.habits) if(h.tags.includes(x.id)){ h.tags=h.tags.filter(q=>q!==x.id); h.updatedAt=stamp; } ch++; }

const prettyKey=k=>String(k||'').replace(/([a-z])([A-Z0-9])/g,'$1 $2').replace(/[-_]+/g,' ').replace(/^./,c=>c.toUpperCase());
const nmEgg=k=>(habNames&&habNames.eggs[k])||ES_EGGS[k]||prettyKey(k);
const nmPot=k=>(habNames&&habNames.potions[k])||ES_POTIONS[k]||prettyKey(k);
const nmFood=k=>(habNames&&habNames.food[k])||ES_FOOD[k]||prettyKey(k);
const nmQuest=k=>{ const q=habNames&&habNames.quests[k]; return q?(typeof q==='string'?q:q.text):prettyKey(k); };
const questInfo=k=>{ const q=habNames&&habNames.quests[k]; return q&&typeof q==='object'?q:null; };
const nmPet=key=>{ const [e,p]=String(key).split('-'); return `${nmEgg(e)} (${nmPot(p)})`; };
const PREMIUM_POTIONS=['RoyalPurple','Cupid','Shimmer','Fairy','Floral','Aquatic','Ember','Thunderstorm','Spooky','Ghost','Holly','Peppermint','StarryNight','Rainbow','Glass','Glow','Frost','IcySnow','RoseQuartz','Celestial','Sunshine','Bronze','Watery','Silver','Shadow','Amber','Aurora','Ruby','BirchBark','Fluorite','SandSculpture','Windup','Turquoise','Vampire','AutumnLeaf','BlackPearl','StainedGlass','PolkaDot','MossyStone','Sunset','Moonglow','SolarSystem','Onyx','Porcelain','PinkMarble','RoseGold','Koi','Gingerbread','Jade','Balloon','Opal'];
const isPremiumPot=p=>!DROP_POTIONS.includes(p)&&!WACKY_POTIONS.includes(p);
function stableInfo(items){
  const eggs=items.eggs||{}, pots=items.hatchingPotions||{}, food=items.food||{}, pets=items.pets||{}, mounts=items.mounts||{};
  /* Eclosionar: un huevo y una poción; las pociones mágicas y raras solo valen con huevos normales; no se puede tener la mascota ya */
  const combos=[];
  for(const [e,ne] of Object.entries(eggs)){ if(!(ne>0)) continue;
    for(const [p,np] of Object.entries(pots)){ if(!(np>0)) continue;
      if(!DROP_POTIONS.includes(p)&&!DROP_EGGS.includes(e)) continue;
      const key=`${e}-${p}`; if(pets[key]>0) continue;
      combos.push({key,egg:e,potion:p,again:pets[key]===-1||!!mounts[key]});
    }
  }
  combos.sort((a,b)=>(a.again-b.again)||nmPet(a.key).localeCompare(nmPet(b.key),'es'));
  /* Cuántas se pueden eclosionar a la vez (cada huevo y cada poción sirven una vez) */
  const le=Object.assign({},eggs), lp=Object.assign({},pots); let hatchMax=0;
  for(const c of combos) if(le[c.egg]>0&&lp[c.potion]>0){ le[c.egg]--; lp[c.potion]--; hatchMax++; }
  /* Alimentar: mascotas sin montura; con su comida favorita (o cualquiera si es mágica) suman 5, con otra 2; a 50 se convierten en montura */
  const growing=[];
  for(const [key,v] of Object.entries(pets)){
    const [e,p]=key.split('-'); if(!(v>0)||mounts[key]||!p) continue;
    if(WACKY_POTIONS.includes(p)) continue;
    if(!(DROP_EGGS.includes(e)||QUEST_EGGS.includes(e))) continue;
    if(!DROP_POTIONS.includes(p)&&!(isPremiumPot(p)&&DROP_EGGS.includes(e))) continue;
    growing.push({key,value:v,potion:p,premium:!DROP_POTIONS.includes(p),need:Math.ceil((50-v)/5)});
  }
  const foodLeft={}; let foodTotal=0, saddles=Number(food.Saddle)||0;
  for(const [k,n] of Object.entries(food)) if(n>0&&k!=='Saddle'){ foodLeft[k]=n; foodTotal+=n; }
  const favOf=p=>Object.keys(foodLeft).filter(k=>foodTarget(k)===p);
  growing.sort((a,b)=>a.need-b.need);
  for(const g of growing){
    const favs=g.premium?Object.keys(foodLeft):favOf(g.potion);
    g.have=favs.reduce((s,k)=>s+(foodLeft[k]||0),0); g.favs=g.premium?[]:favs.length?favs:Object.keys(FOOD_TARGET).filter(k=>FOOD_TARGET[k]===g.potion);
    g.canMount=g.have>=g.need;
    if(g.canMount){ let n=g.need; for(const k of (g.premium?Object.keys(foodLeft):favs)){ const u=Math.min(n,foodLeft[k]||0); foodLeft[k]-=u; n-=u; if(!n) break; } }
  }
  const mountable=growing.filter(g=>g.canMount);
  return {combos,hatchMax,growing,mountable,foodTotal,saddles,food};
}
/* Huevos y pociones que ya no hacen falta para nada: todas las mascotas y monturas que pueden dar están conseguidas.
   Cada combinación pide: mascota y montura → nada; solo una de las dos → 1 (si se cría la mascota hasta montura, hay que volver a eclosionarla);
   ninguna → 2; las pociones raras no dan montura → 1 si falta la mascota. Cuentan las pociones normales y los huevos normales siempre;
   los huevos de misión y las pociones mágicas o raras, si los tienes o ya tienes alguna de sus mascotas o monturas. */
const allMagicPotions=()=>(habNames&&habNames.potions?Object.keys(habNames.potions):PREMIUM_POTIONS.concat(WACKY_POTIONS)).filter(p=>!DROP_POTIONS.includes(p));
function sellInfo(items){
  const eggs=items.eggs||{}, pots=items.hatchingPotions||{}, pets=items.pets||{}, mounts=items.mounts||{};
  const touched=Object.keys(pets).filter(k=>pets[k]>0||pets[k]===-1).concat(Object.keys(mounts).filter(k=>mounts[k]));
  const cEggs=habNames&&habNames.eggs?habNames.eggs:null, cPots=habNames&&habNames.potions?habNames.potions:null;
  const eggOk=e=>DROP_EGGS.includes(e)||QUEST_EGGS.includes(e)||!!(cEggs&&cEggs[e]);
  const potOk=p=>DROP_POTIONS.includes(p)||WACKY_POTIONS.includes(p)||(cPots?!!cPots[p]:false)||pots[p]>0;
  const E=new Set(DROP_EGGS), P=new Set(DROP_POTIONS);
  for(const [e,n] of Object.entries(eggs)) if(n>0) E.add(e);
  for(const [p,n] of Object.entries(pots)) if(n>0) P.add(p);
  for(const k of touched){ const [e,p]=k.split('-'); if(e&&p&&eggOk(e)&&potOk(p)){ E.add(e); P.add(p); } }
  /* Todas las pociones mágicas y raras que existen, aunque no las tengas: los huevos normales se guardan también para ellas */
  const PA=new Set(P); for(const p of allMagicPotions()) PA.add(p);
  const fits=(e,p)=>DROP_POTIONS.includes(p)?true:DROP_EGGS.includes(e);
  const need=(e,p)=>{ const k=`${e}-${p}`, hp=pets[k]>0, hm=!!mounts[k]; if(WACKY_POTIONS.includes(p)) return hp?0:1; return hp&&hm?0:hp||hm?1:2; };
  const nm=x=>x.type==='eggs'?nmEgg(x.key):nmPot(x.key);
  const calc=Ps=>{
    const out=[];
    for(const [type,inv,others] of [['eggs',eggs,Ps],['potions',pots,E]]){
      for(const [k,n] of Object.entries(inv)){ if(!(n>0)) continue;
        let req=0; for(const o of others){ const [e,p]=type==='eggs'?[k,o]:[o,k]; if(fits(e,p)) req+=need(e,p); }
        const extra=n-req; if(extra>0){ const each=sellVal(type,k); out.push({type,key:k,have:n,need:req,extra,each,gold:extra*each}); }
      }
    }
    out.sort((a,b)=>(a.type!==b.type?(a.type==='eggs'?-1:1):0)||b.gold-a.gold||nm(a).localeCompare(nm(b),'es'));
    return out;
  };
  const list=calc(PA), loose=calc(P);
  /* Lo que además podrías vender si no piensas comprar más pociones mágicas ni raras */
  const more=[]; for(const x of loose){ const s=list.find(y=>y.type===x.type&&y.key===x.key), d=x.extra-(s?s.extra:0); if(d>0) more.push(Object.assign({},x,{extra:d,gold:d*x.each,need:x.need})); }
  const tot=l=>({count:l.reduce((a,x)=>a+x.extra,0),gold:l.reduce((a,x)=>a+x.gold,0)});
  return Object.assign({list,more,moreTot:tot(more)},tot(list));
}
function habAlerts(){
  const snap=habRt.user?habSnap():(habCfg&&habCfg.snap);
  if(!snap||!snap.items) return null;
  const s=stableInfo(snap.items); const out=[];
  const nNew=s.combos.filter(c=>!c.again).length;
  if(s.hatchMax) out.push(nNew?`puedes eclosionar ${pl(Math.min(s.hatchMax,nNew),'mascota nueva','mascotas nuevas')}`:`puedes eclosionar ${pl(s.hatchMax,'mascota','mascotas')} que ya criaste`);
  if(s.mountable.length) out.push(`tu comida alcanza para ${pl(s.mountable.length,'montura','monturas')}`);
  else if(s.foodTotal&&s.growing.length) out.push(`tienes ${pl(s.foodTotal,'pieza','piezas')} de comida para tus mascotas`);
  if(s.saddles) out.push(`tienes ${pl(s.saddles,'silla de montar','sillas de montar')}`);
  const sv=sellInfo(snap.items); if(sv.count) out.push(`puedes vender ${pl(sv.count,'huevo o poción que ya no necesitas','huevos y pociones que ya no necesitas')} por ${fmtNum(sv.gold)} de oro`);
  return out.length?{text:cap(listY(out)),s}:null;
}

/* ---- Importar y enlazar ---- */
function habTaskKinds(t){ if(t.type==='daily') return ['daily']; const k=[]; if(t.up!==false) k.push('up'); if(t.down) k.push('down'); return k.length?k:['up']; }
const habLinked=(id,kind)=>state.habitica.map.find(m=>m.habiticaId===id&&m.kind===kind&&habitById(m.habitId));
/* Crea los hábitos de una tarea de Habitica (dos si el hábito tiene + y −) y trae su historial */
function habImport(t){
  const id=t.id||t._id, kinds=habTaskKinds(t), made=[], both=kinds.length>1;
  let logs=0, olds=0;
  for(const kind of kinds){
    if(habLinked(id,kind)) continue;
    const order=state.habits.length?Math.max(...state.habits.map(q=>q.order))+1:0, now=nowIso();
    const color=HABIT_COLORS[state.habits.length%HABIT_COLORS.length];
    const base={id:newId(),name:habLocalName(t.text,kind,both),description:String(t.notes||'').slice(0,2000),order,color,createdAt:now,updatedAt:now,tags:(Array.isArray(t.tags)?t.tags:[]).map(x=>'hab-'+x).filter(x=>state.tags.some(g=>g.id===x)),categoryId:null,tod:'any'};
    let x;
    if(kind==='daily'){
      const conv=habSchedule(t), sd=habStartDate(t), cyc=habCycleSchedule(t), sc=cyc||conv.schedule;
      x=Object.assign(base,{kind:cyc?'count':'check',target:cyc?{amount:1,unit:'de la lista'}:null,icon:cyc?'list':'check',schedule:sc,scheduleHistory:[{from:sd,schedule:sc}],startDate:sd,archived:!!conv.grey});
    } else {
      const {days}=habHabitDays(t); let first=habStartDate(t); for(const d of days.keys()) if(d<first) first=d;
      const up=kind==='up';
      x=Object.assign(base,{kind:up?'count':'avoid',target:up?{amount:1,unit:'veces'}:null,icon:up?'plus':'minus',schedule:{type:'daily'},scheduleHistory:[{from:first,schedule:{type:'daily'}}],startDate:first});
    }
    const n=normalizeItem(x,{catIds:new Set(state.categories.map(c=>c.id)),tagIds:new Set(state.tags.map(g=>g.id)),idx:order});
    if(!n) continue;
    state.habits.push(n); delete state.deleted['habit:'+n.id];
    state.habitica.map.push({habiticaId:id,habitId:n.id,kind,name:t.text||'',updatedAt:now}); delete state.deleted['hlink:'+id+'|'+kind];
    const r=habBackfill(t,n,kind); logs+=r.logs; olds+=r.olds;
    made.push(n);
  }
  return {made,logs,olds};
}
/* Enlaza una tarea con un hábito que ya existe y completa su historial (sin tocar lo que ya hay) */
function habLink(t,kind,h){
  const id=t.id||t._id, now=nowIso();
  for(const m of state.habitica.map) if(m.habitId===h.id&&!(m.habiticaId===id&&m.kind===kind)) state.deleted['hlink:'+m.habiticaId+'|'+m.kind]=now;
  state.habitica.map=state.habitica.map.filter(m=>!(m.habiticaId===id&&m.kind===kind)&&m.habitId!==h.id);
  state.habitica.map.push({habiticaId:id,habitId:h.id,kind,name:t.text||'',updatedAt:now}); delete state.deleted['hlink:'+id+'|'+kind];
  return habBackfill(t,h,kind);
}
function habBackfill(t,h,kind){
  const id=t.id||t._id, t0=today(), stamp=nowIso(); let logs=0;
  if(kind==='daily'&&isCycle(h.schedule)){ const m=habLinked(id,'daily'); habCycleSync(t,h,m,stamp); logs=state.logs.filter(l=>l.habitId===h.id).length; return {logs,olds:0}; }
  const r=kind==='daily'?habDailyDays(t):habHabitDays(t);
  for(const [d,v] of r.days){
    if(d>t0||getLog(h.id,d)) continue;
    const n=kind==='daily'?(v?1:0):habDayValue(h,kind,v);
    if(!n) continue;
    habPut(h,d,n,stamp); logs++;
  }
  /* Medias de periodos antiguos (Habitica ya no guarda sus días): aparte, sin inventar días */
  state.habitica.history=state.habitica.history.filter(e=>!(e.habiticaId===id&&e.kind===kind));
  const agg=new Map(); for(const e of r.old){ const a=agg.get(e.period)||{s:0,n:0}; a.s+=e.value; a.n++; agg.set(e.period,a); }
  for(const [period,a] of agg) state.habitica.history.push({habiticaId:id,kind,period,value:Math.round(a.s/a.n*1000)/1000});
  return {logs,olds:agg.size};
}
function habUnlink(m){ const h=habitById(m.habitId); commit(`Enlace con Habitica quitado${h?`: «${h.name}» se conserva y vuelve a marcarse aquí`:''}`,()=>{ state.deleted['hlink:'+m.habiticaId+'|'+m.kind]=nowIso(); state.habitica.map=state.habitica.map.filter(x=>!(x.habiticaId===m.habiticaId&&x.kind===m.kind)); }); }

/* ---- Hábitos con + y −: análisis conjunto ---- */
/* Pareja de un hábito importado de Habitica con los dos botones */
function pmPair(hid){
  const m=habLinkOf(hid); if(!m||m.kind==='daily') return null;
  const up=state.habitica.map.find(x=>x.habiticaId===m.habiticaId&&x.kind==='up'), dn=state.habitica.map.find(x=>x.habiticaId===m.habiticaId&&x.kind==='down');
  const hu=up&&habitById(up.habitId), hd=dn&&habitById(dn.habitId);
  if(!hu||!hd) return null;
  return {up:hu,down:hd,habiticaId:m.habiticaId,name:m.name||hu.name.replace(/ \(\+\)$/,''),value:Number.isFinite(dn.value)?dn.value:up.value};
}
const pmVal=(h,d)=>{ const l=getLog(h.id,d); return l?(h.kind==='check'?1:l.value):0; };
function pmStats(p,a,b){
  const start=p.up.startDate<p.down.startDate?p.up.startDate:p.down.startDate, t=today();
  const from=a>start?a:start, to=b>t?t:b;
  const r={days:0,plus:0,minus:0,favor:0,against:0,even:0,active:0,clean:0,wd:Array.from({length:7},()=>({n:0,plus:0,minus:0}))};
  if(from>to) return r;
  for(let d=from;d<=to;d=addDaysS(d,1)){
    const u=pmVal(p.up,d), m=pmVal(p.down,d), w=r.wd[dowOf(d)];
    r.days++; r.plus+=u; r.minus+=m; w.n++; w.plus+=u; w.minus+=m;
    if(u||m) r.active++;
    if(!m) r.clean++;
    if(u>m) r.favor++; else if(m>u) r.against++; else if(u||m) r.even++;
  }
  /* Rachas sin − (desde el inicio, no solo en el periodo) */
  let cur=0,best=0,run=0;
  for(let d=start;d<=t;d=addDaysS(d,1)){ if(pmVal(p.down,d)){ run=0; } else { run++; if(run>best) best=run; } }
  cur=run; r.cleanCur=cur; r.cleanBest=best;
  return r;
}
/* Colores de Habitica según el valor de la tarea */
function habValueColor(v){
  if(v<-20) return ['Rojo oscuro','var(--hv-1)']; if(v<-10) return ['Rojo','var(--hv-2)']; if(v<-1) return ['Naranja','var(--hv-3)'];
  if(v<1) return ['Amarillo','var(--hv-4)']; if(v<5) return ['Verde','var(--hv-5)']; if(v<10) return ['Azul claro','var(--hv-6)']; return ['Azul','var(--hv-7)'];
}
/* Barras divergentes: + hacia arriba, − hacia abajo, con el balance como punto */
function divergingChart(container,items,{title=''}={}){
  const {W,H}=chartBox(container,230), ml=40, mr=8, mt=16, mb=24, pw=W-ml-mr, ph=H-mt-mb, band=pw/items.length, bw=Math.max(2,Math.min(22,band*0.62));
  const mx=niceMax(Math.max(1,...items.map(i=>Math.max(i.plus||0,i.minus||0))));
  const y0=mt+ph/2, sc=(ph/2)/mx;
  const svg=svgEl('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,role:'img'});
  svg.setAttribute('aria-label',title+'. '+items.filter(i=>i.plus!=null).map(i=>`${i.full||i.label}: ${fmtNum(i.plus)} a favor, ${fmtNum(i.minus)} en contra`).join('; '));
  for(const g of [mx,mx/2,0,-mx/2,-mx]){ const y=y0-g*sc; svg.append(svgEl('line',{x1:ml,x2:W-mr,y1:y,y2:y,class:g===0?'gl0':'gl'})); const t=svgEl('text',{x:ml-6,y:y+4,'text-anchor':'end',class:'ax'}); t.textContent=(g>0?'+':g<0?'−':'')+fmtNum(Math.round(Math.abs(g)*10)/10); svg.append(t); }
  xLabels(svg,items,{ml,band,H});
  items.forEach((it,i)=>{
    if(it.plus==null) return;
    const cx=ml+band*i+band/2, x=cx-bw/2;
    const tip=`${it.full||it.label}: +${fmtNum(it.plus)} / −${fmtNum(it.minus)} (balance ${it.plus-it.minus>0?'+':it.plus-it.minus<0?'−':''}${fmtNum(Math.abs(Math.round((it.plus-it.minus)*10)/10))})`;
    svg.append(svgEl('rect',{x:ml+band*i,y:mt,width:band,height:ph,class:'hit','data-tip':tip}));
    const hu=it.plus*sc, hd=it.minus*sc, r1=Math.min(4,hu,bw/2), r2=Math.min(4,hd,bw/2);
    if(hu>0) svg.append(svgEl('path',{d:`M${x},${y0-1} V${y0-hu+r1} Q${x},${y0-hu} ${x+r1},${y0-hu} H${x+bw-r1} Q${x+bw},${y0-hu} ${x+bw},${y0-hu+r1} V${y0-1} Z`,fill:'var(--done)',class:'bar','data-tip':tip}));
    if(hd>0) svg.append(svgEl('path',{d:`M${x},${y0+1} V${y0+hd-r2} Q${x},${y0+hd} ${x+r2},${y0+hd} H${x+bw-r2} Q${x+bw},${y0+hd} ${x+bw},${y0+hd-r2} V${y0+1} Z`,fill:'var(--danger)',class:'bar','data-tip':tip}));
    if(band>=10&&(it.plus||it.minus)) svg.append(svgEl('circle',{cx,cy:y0-(it.plus-it.minus)*sc,r:Math.min(3.5,band/4),class:'pm-net','data-tip':tip}));
  });
  container.replaceChildren(svg);
}
